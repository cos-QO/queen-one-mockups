// ── Section: AgencyRail ────────────────────────────────
// → ConnectUI: PermanentSidebar | spacing.xl
function AgencyRail({ tab1View, setTab1View }) {
  const coreItems = [
    { key: 'besties-hub',       label: 'Besties Hub',       icon: <Icon name="home-simple" size={20} /> },
    { key: 'pipeline-tracker',  label: 'Pipeline Tracker',  icon: <Icon name="kanban" size={20} /> },
    { key: 'client-tracker',    label: 'Client Tracker',    icon: <Icon name="table-2-columns" size={20} /> },
    { key: 'billing',           label: 'Billing',           icon: <Icon name="wallet-alt" size={20} /> },
    { key: 'resources',         label: 'Resources',         icon: <Icon name="bookmark-book" size={20} /> },
  ];
  const toolItems = [
    { key: 'revenue-calc',   label: 'Revenue Calc',    icon: <Icon name="calculator" size={20} /> },
    { key: 'audit-request',  label: 'Audit Request',   icon: <Icon name="clipboard-check" size={20} /> },
    { key: 'sales-materials',label: 'Sales Materials', icon: <Icon name="multiple-pages" size={20} /> },
    { key: 'pre-unveil',     label: 'Pre-Unveil',      icon: <Icon name="eye-alt" size={20} /> },
    { key: 'onboarding-wiz', label: 'Onboarding Wiz.', icon: <Icon name="magic-wand" size={20} /> },
  ];
  const navViews = ['besties-hub', 'pipeline-tracker', 'client-tracker'];

  return (
    <Drawer
      variant="permanent"
      sx={{
        width: 240,
        flexShrink: 0,
        '& .MuiDrawer-paper': {
          position: 'relative',
          width: 240,
          height: '100%',
          overflowY: 'auto',
          borderRight: '1px solid #E4E4E7',
          boxShadow: 'none',
          bgcolor: '#FFFFFF',
        },
      }}
    >
      <Box sx={{ px: 1, pt: 2, pb: 1 }}>
        {/* ── Section: CoreNavSection ────────────────────── */}
        {/* → ConnectUI: NavSection | spacing.sm */}
        <Typography
          variant="overline"
          sx={{ display: 'block', px: 1.5, pb: 0.5, color: '#6B7280', fontSize: '12px', fontWeight: 500, letterSpacing: '0.06em', textTransform: 'uppercase' }}
        >
          Core Pages
        </Typography>
        <List dense disablePadding>
          {coreItems.map((item) => {
            const isActive = tab1View === item.key;
            const isClickable = navViews.includes(item.key);
            return (
              <ListItemButton
                key={item.key}
                onClick={isClickable ? () => setTab1View(item.key) : undefined}
                sx={{
                  borderRadius: '6px',
                  mb: 0.25,
                  height: 36,
                  bgcolor: isActive ? '#F8F9FC' : 'transparent',
                  borderLeft: isActive ? '3px solid #0D0D0D' : '3px solid transparent',
                  pl: isActive ? '9px' : '12px',
                  color: isActive ? '#0D0D0D' : '#6B7280',
                  cursor: isClickable ? 'pointer' : 'default',
                  '&:hover': { bgcolor: isClickable ? 'rgba(0,0,0,0.04)' : 'transparent', color: isClickable ? '#0D0D0D' : '#6B7280' },
                }}
              >
                <ListItemIcon sx={{ minWidth: 28, color: 'inherit' }}>{item.icon}</ListItemIcon>
                <ListItemText
                  primary={item.label}
                  primaryTypographyProps={{ fontSize: '13px', fontWeight: isActive ? 500 : 400, color: 'inherit' }}
                />
              </ListItemButton>
            );
          })}
        </List>

        <Typography
          variant="overline"
          sx={{ display: 'block', px: 1.5, pt: 2, pb: 0.5, color: '#6B7280', fontSize: '12px', fontWeight: 500, letterSpacing: '0.06em', textTransform: 'uppercase' }}
        >
          Pre-Sale Tools
        </Typography>
        <List dense disablePadding>
          {toolItems.map((item) => (
            <ListItemButton
              key={item.key}
              sx={{
                borderRadius: '6px',
                mb: 0.25,
                height: 36,
                color: '#6B7280',
                borderLeft: '3px solid transparent',
                pl: '12px',
                cursor: 'default',

            >
              <ListItemIcon sx={{ minWidth: 28, color: 'inherit' }}>{item.icon}</ListItemIcon>

                primary={item.label}
                primaryTypographyProps={{ fontSize: '13px', fontWeight: 400, color: 'inherit' }}
              />
            </ListItemButton>
          ))}
        </List>
      </Box>
    </Drawer>
  );
}

  return (
    <Box sx={{ flex: 1, overflowY: 'auto', p: 3, bgcolor: '#EAEAF0' }}>
      {/* ── Section: KPISummaryStrip ──────────────────── */}
      {/* → ConnectUI: KPIStrip | spacing.md */}

                    </Stack>
                    <Stack direction="row" spacing={2} mb={1}>
                      <Typography variant="caption" sx={{ color: '#6B7280' }}>{card.revenue}</Typography>

              alignItems: 'center',
              justifyContent: 'center',
              cursor: 'pointer',
              color: '#6B7280',
              '&:hover': { color: '#0D0D0D' },
              borderRadius: '2px',
            }}
          >
            <Icon name="x-mark" size={14} />
          </Box>
        </Box>
      )}
    </Box>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────

function App() {
  const [activeTab, setActiveTab] = React.useState(1);
  const [tab2Open, setTab2Open] = React.useState(false);
  const [tab1View, setTab1View] = React.useState('besties-hub');
  const [pipelineDrawerOpen, setPipelineDrawerOpen] = React.useState(false);
  const [selectedCardId, setSelectedCardId] = React.useState(null);
  const [clientTrackerView, setClientTrackerView] = React.useState('onboarding');
  const [brandWorkspaceActiveItem, setBrandWorkspaceActiveItem] = React.useState('brand-book');

  // Derived: pipeline drawer visible only when conditions hold
  const drawerVisible = (activeTab === 1) && (tab1View === 'pipeline-tracker') && pipelineDrawerOpen;

  function openBrandWorkspace() {
    setTab2Open(true);
    setActiveTab(2);
    setBrandWorkspaceActiveItem('brand-book');
  }

  function closeTab2() {
    setTab2Open(false);
    setActiveTab(1);
    // tab1View intentionally NOT reset — agency tab returns to last state
  }

  function handleCardClick(cardId) {
    setSelectedCardId(cardId);
    setPipelineDrawerOpen(true);
  }

  function handleDrawerClose() {
    setPipelineDrawerOpen(false);
    setSelectedCardId(null);
  }

  // Tab 1 AppBar right slot
  const tab1AppBarRight = {
    'besties-hub': (
      <Stack direction="row" spacing={1} alignItems="center">
        <SearchInputField />
        <Button
          variant="outlined"
          size="small"
          startIcon={<Icon name="user-plus" size={16} />}
          sx={{ borderColor: '#CBD5E1', color: '#374151', fontSize: '13px', '&:hover': { borderColor: '#0D0D0D', color: '#0D0D0D' } }}
        >
          Invite
        </Button>
        <IconButton size="small" sx={{ color: '#6B7280' }}>
          <Icon name="bell" size={20} />
        </IconButton>
        <Avatar sx={{ width: 32, height: 32, bgcolor: '#E4E4E7', fontSize: '12px', color: '#6B7280' }}>AJ</Avatar>
      </Stack>
    ),
    'pipeline-tracker': (
      <Stack direction="row" spacing={1} alignItems="center">
        <Button
          variant="contained"
          size="small"
          sx={{ bgcolor: '#0D0D0D', color: '#FFFFFF', fontSize: '13px', '&:hover': { bgcolor: '#374151' } }}
        >
          Add Brand
        </Button>
        <Button
          variant="outlined"
          size="small"
          startIcon={<Icon name="filter" size={16} />}
          sx={{ borderColor: '#CBD5E1', color: '#374151', fontSize: '13px', '&:hover': { borderColor: '#0D0D0D', color: '#0D0D0D' } }}
        >
          Filter
        </Button>
        <IconButton size="small" sx={{ color: '#6B7280' }}>
          <Icon name="bell" size={20} />
        </IconButton>
        <Avatar sx={{ width: 32, height: 32, bgcolor: '#E4E4E7', fontSize: '12px', color: '#6B7280' }}>AJ</Avatar>
      </Stack>
    ),
    'client-tracker': (
      <Stack direction="row" spacing={1} alignItems="center">
        <TextField
          size="small"
          placeholder="Search brands…"
          variant="outlined"
          sx={{ width: 200 }}
          InputProps={{ sx: { fontSize: '13px', bgcolor: '#FFFFFF' } }}
        />
        <Button
          variant="outlined"
          size="small"
          startIcon={<Icon name="filter" size={16} />}
          sx={{ borderColor: '#CBD5E1', color: '#374151', fontSize: '13px', '&:hover': { borderColor: '#0D0D0D', color: '#0D0D0D' } }}
        >
          Filter
        </Button>
        <IconButton size="small" sx={{ color: '#6B7280' }}>
          <Icon name="bell" size={20} />
        </IconButton>
        <Avatar sx={{ width: 32, height: 32, bgcolor: '#E4E4E7', fontSize: '12px', color: '#6B7280' }}>AJ</Avatar>
      </Stack>
    ),
  };

  const tab1Title = {
    'besties-hub': 'Besties Hub',
    'pipeline-tracker': 'Pipeline Tracker',
    'client-tracker': 'Client Tracker',
  };

  return (
    <Box sx={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', bgcolor: '#EAEAF0' }}>
      {/* ── Section: SimulatedTabStrip ─────────────────── */}
      <SimulatedTabStrip
        activeTab={activeTab}
        setActiveTab={setActiveTab}
        tab2Open={tab2Open}
        closeTab2={closeTab2}
      />

      {/* ── App viewport — height: calc(100vh - 36px) ──── */}
      <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', height: 'calc(100vh - 36px)' }}>

        {/* ── TAB 1 CONTENT ─────────────────────────────── */}
        {activeTab === 1 && (
          <>
            {/* ── Section: Tab1AppBar ──────────────────── */}
            <Tab1AppBar title={tab1Title[tab1View]} rightSlot={tab1AppBarRight[tab1View]} />

            {/* Content row: left rail + main */}
            <Box
              sx={{
                flex: 1,
                display: 'flex',
                flexDirection: 'row',
                overflow: 'hidden',
                height: 'calc(100vh - 36px - 56px)',
              }}
            >
              {/* Agency left rail — DOM-gated, NOT CSS-hidden */}
              {activeTab === 1 && (
                <AgencyRail tab1View={tab1View} setTab1View={setTab1View} />
              )}

              {/* Main content area */}
              <Box sx={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', bgcolor: '#EAEAF0' }}>
                {tab1View === 'besties-hub' && (
                  <BestiesHub setTab1View={setTab1View} setClientTrackerView={setClientTrackerView} />
                )}
                {tab1View === 'pipeline-tracker' && (
                  <PipelineTracker onCardClick={handleCardClick} />
                )}
                {tab1View === 'client-tracker' && (
                  <ClientTracker
                    clientTrackerView={clientTrackerView}
                    setClientTrackerView={setClientTrackerView}
                    onOpenWorkspace={openBrandWorkspace}
                  />
                )}
              </Box>
            </Box>

            {/* Pipeline card drawer — Tab 1 only */}
            <PipelineCardDrawer
              open={drawerVisible}
              cardId={selectedCardId}
              onClose={handleDrawerClose}
            />
          </>
        )}

        {/* ── TAB 2 CONTENT ─────────────────────────────── */}
        {/* No agency left rail rendered in Tab 2 at all */}
        {activeTab === 2 && tab2Open && (
          <BrandWorkspace
            brandWorkspaceActiveItem={brandWorkspaceActiveItem}
            setBrandWorkspaceActiveItem={setBrandWorkspaceActiveItem}
          />
        )}
      </Box>
    </Box>
  );
}

// ── Render ─────────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(
  <ThemeProvider theme={theme}>
    <App />
  </ThemeProvider>
);
</script>
</body>
</html>
