<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Wireframe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      ThemeProvider,
      CssBaseline,
      createTheme,
      Box,
      Card,
      CardContent,
      Typography,
      TextField,
      Button,
      Stack,
      FormControlLabel,
      Checkbox,
      Fade,
    } = MaterialUI;

    const theme = createTheme({
      palette: {
        mode: 'light',
        primary:    { main: '#424242' },
        secondary:  { main: '#757575' },
        error:      { main: '#757575' },
        warning:    { main: '#9E9E9E' },
        info:       { main: '#757575' },
        success:    { main: '#616161' },
        background: { default: '#F5F5F5', paper: '#FFFFFF' },
        text: { primary: '#212121', secondary: '#757575', disabled: '#BDBDBD' },
        divider: '#E0E0E0',
      },
      typography: { fontFamily: 'Inter, sans-serif' },
      shadows: Array(25).fill('none'),
      components: {
        MuiPaper:   { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E0E0E0' } } },
        MuiCard:    { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E0E0E0' } } },
        MuiAppBar:  { defaultProps: { elevation: 0 }, styleOverrides: { root: { borderBottom: '1px solid #E0E0E0' } } },
        MuiButton:  { defaultProps: { disableElevation: true } },
        MuiDialog:  { defaultProps: { elevation: 0 }, styleOverrides: { paper: { border: '1px solid #E0E0E0' } } },
        MuiDrawer:  { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
        MuiPopover: { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
        MuiMenu:    { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
      },
    });

    {/* ── Create Account Form ───────────────────── */}
    {/* → ConnectUI: <FormCard> | spacing.lg, surface.raised */}
    function CreateAccountForm({ agreed, onAgreedChange, onSubmit, onSignIn }) {
      return (
        <Card>
          <CardContent sx={{ p: 4 }}>
            <Stack spacing={3}>

              <Stack spacing={1}>
                <Typography variant="h5" fontWeight={600}>
                  Create Account
                </Typography>
                <Typography variant="body2" color="text.secondary">
                  Fill in the information below to continue.
                </Typography>
              </Stack>

              {/* ── Form Fields Stack ──────────────────────── */}
              {/* → ConnectUI: <TextField> (outlined) | typography.body, spacing.md */}
              <Stack spacing={2}>
                <TextField
                  label="Full Name"
                  type="text"
                  variant="outlined"
                  fullWidth
                  placeholder="Enter your name"
                />
                <TextField
                  label="Email Address"
                  type="email"
                  variant="outlined"
                  fullWidth
                  placeholder="Enter your email"
                />
                <TextField
                  label="Password"
                  type="password"
                  variant="outlined"
                  fullWidth
                  placeholder="Enter a password"
                />
                <TextField
                  label="Confirm Password"
                  type="password"
                  variant="outlined"
                  fullWidth
                  placeholder="Confirm your password"
                />
              </Stack>

              {/* ── Terms Checkbox Row ─────────────────────── */}
              {/* → ConnectUI: <Checkbox + Label> | typography.body2 */}
              <FormControlLabel
                control={
                  <Checkbox
                    checked={agreed}
                    onChange={(e) => onAgreedChange(e.target.checked)}
                    sx={{ color: '#424242', '&.Mui-checked': { color: '#424242' } }}
                  />
                }
                label={
                  <Typography variant="body2">
                    I agree to the terms and conditions
                  </Typography>
                }
              />

              {/* ── Primary Action ─────────────────────────── */}
              {/* → ConnectUI: <Button variant="primary"> | spacing.md */}
              <Button
                variant="outlined"
                fullWidth
                size="large"
                onClick={onSubmit}
                sx={{
                  borderColor: '#424242',
                  color: '#212121',
                  '&:hover': { backgroundColor: 'rgba(0,0,0,0.04)', borderColor: '#212121' },
                }}
              >
                Create Account
              </Button>

              {/* ── Secondary Action ───────────────────────── */}
              {/* → ConnectUI: <Link> | typography.body2 */}
              <Typography variant="body2" align="center" color="text.secondary">
                Already have an account?{' '}
                <span
                  onClick={onSignIn}
                  style={{ cursor: 'pointer', textDecoration: 'underline', color: '#212121' }}
                >
                  Sign in
                </span>
              </Typography>

            </Stack>
          </CardContent>
        </Card>
      );
    }

    function SuccessState({ onBack }) {
      return (
        <Card>
          <CardContent sx={{ p: 4 }}>
            <Stack spacing={3}>
              <Stack spacing={1}>
                <Typography variant="h5" fontWeight={600}>
                  Account created
                </Typography>
                <Typography variant="body2" color="text.secondary">
                  Your account has been successfully created.
                </Typography>
              </Stack>
              <Button
                variant="outlined"
                fullWidth
                size="large"
                onClick={onBack}
                sx={{
                  borderColor: '#424242',
                  color: '#212121',
                  '&:hover': { backgroundColor: 'rgba(0,0,0,0.04)', borderColor: '#212121' },
                }}
              >
                Back to form
              </Button>
            </Stack>
          </CardContent>
        </Card>
      );
    }

    function SignInStub({ onBack }) {
      return (
        <Card>
          <CardContent sx={{ p: 4 }}>
            <Stack spacing={3}>
              <Stack spacing={1}>
                <Typography variant="h5" fontWeight={600}>
                  Sign in placeholder
                </Typography>
                <Typography variant="body2" color="text.secondary">
                  This screen is a stub. The sign-in flow lives here.
                </Typography>
              </Stack>
              <Button
                variant="outlined"
                fullWidth
                size="large"
                onClick={onBack}
                sx={{
                  borderColor: '#424242',
                  color: '#212121',
                  '&:hover': { backgroundColor: 'rgba(0,0,0,0.04)', borderColor: '#212121' },
                }}
              >
                Back to create
              </Button>
            </Stack>
          </CardContent>
        </Card>
      );
    }

    {/* ── Motion: view-switch → ConnectUI: route transition | fade 200ms */}
    function App() {
      const [view, setView] = React.useState('form');
      const [agreed, setAgreed] = React.useState(false);

      return (
        <Box
          sx={{
            minHeight: '100vh',
            backgroundColor: 'background.default',
            display: 'flex',
            alignItems: 'flex-start',
            justifyContent: 'center',
            pt: 8,
            pb: 8,
            px: 2,
          }}
        >
          <Box sx={{ width: '100%', maxWidth: 460 }}>
            <Fade in={view === 'form'} timeout={200} unmountOnExit>
              <div>
                <CreateAccountForm
                  agreed={agreed}
                  onAgreedChange={setAgreed}
                  onSubmit={() => setView('success')}
                  onSignIn={() => setView('signin')}
                />
              </div>
            </Fade>
            <Fade in={view === 'success'} timeout={200} unmountOnExit>
              <div>
                <SuccessState onBack={() => setView('form')} />
              </div>
            </Fade>
            <Fade in={view === 'signin'} timeout={200} unmountOnExit>
              <div>
                <SignInStub onBack={() => setView('form')} />
              </div>
            </Fade>
          </Box>
        </Box>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ThemeProvider theme={theme}>
        <CssBaseline />
        <App />
      </ThemeProvider>
    );
  </script>
</body>
</html>
