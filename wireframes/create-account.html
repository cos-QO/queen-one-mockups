<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Wireframe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:0;">
  <div id="root"></div>

  <script type="text/babel">
    const {
      Box,
      Paper,
      Typography,
      Stack,
      TextField,
      FormControlLabel,
      Checkbox,
      Button,
      Link,
      ThemeProvider,
      createTheme,
      Fade,
    } = MaterialUI;

    const theme = createTheme({
      palette: {
        mode: 'light',
        primary:    { main: '#424242' },
        secondary:  { main: '#757575' },
        error:      { main: '#757575' },
        warning:    { main: '#9E9E9E' },
        info:       { main: '#757575' },
        success:    { main: '#616161' },
        background: { default: '#F5F5F5', paper: '#FFFFFF' },
        text: { primary: '#212121', secondary: '#757575', disabled: '#BDBDBD' },
        divider: '#E0E0E0',
      },
      typography: {
        fontFamily: 'Inter, sans-serif',
        body1: { fontSize: '14px' },
        body2: { fontSize: '14px' },
        caption: { fontSize: '12px' },
        overline: { fontSize: '12px' },
      },
      shadows: Array(25).fill('none'),
      components: {
        MuiPaper:   { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E0E0E0' } } },
        MuiCard:    { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E0E0E0' } } },
        MuiAppBar:  { defaultProps: { elevation: 0 }, styleOverrides: { root: { borderBottom: '1px solid #E0E0E0' } } },
        MuiButton:  { defaultProps: { disableElevation: true } },
        MuiDialog:  { defaultProps: { elevation: 0 }, styleOverrides: { paper: { border: '1px solid #E0E0E0' } } },
        MuiDrawer:  { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
        MuiPopover: { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
        MuiMenu:    { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
      },
    });

    function CreateAccountForm({ name, setName, email, setEmail, password, setPassword, confirm, setConfirm, agreed, setAgreed, formIsValid, onSubmit, onSignIn }) {
      return (
        /* ── Form Container ─────────────────────────── */
        /* → ConnectUI: Card + CardContent | spacing.lg | surface.paper */
        <Paper sx={{ width: '100%', maxWidth: 460, p: 4, border: '1px solid #E0E0E0' }}>
          <Stack spacing={3}>

            {/* ── Title + Description ────────────────────── */}
            {/* → ConnectUI: Typography (h5 + body2 secondary) */}
            <Stack spacing={0.75}>
              <Typography variant="h5">Create Account</Typography>
              <Typography variant="body2" color="text.secondary">
                Fill in the information below to continue.
              </Typography>
            </Stack>

            {/* ── Field Stack ────────────────────────────── */}
            {/* → ConnectUI: TextField cluster | spacing.md between */}
            <Stack spacing={2.5}>
              <TextField
                label="Full Name"
                variant="outlined"
                fullWidth
                placeholder="Jane Smith"
                value={name}
                onChange={(e) => setName(e.target.value)}
                inputProps={{ 'aria-label': 'Full Name' }}
              />
              <TextField
                label="Email Address"
                variant="outlined"
                fullWidth
                type="email"
                placeholder="jane@example.com"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                inputProps={{ 'aria-label': 'Email Address' }}
              />
              <TextField
                label="Password"
                variant="outlined"
                fullWidth
                type="password"
                placeholder="••••••••"f�VS׷77v�&GТ��6��vSײ�R���6WE77v�&B�R�F&vWB�f�VR�Т��WE&�3׷�v&���&V�s�u77v�&Br�Т���FW�Df�V�@��&V��$6��f�&�77v�&B �f&��C�&�WFƖ�VB �gV��v�GF��G�S�'77v�&B ��6V���FW#�.(

"                value={confirm}
                onChange={(e) => setConfirm(e.target.value)}
                inputProps={{ 'aria-label': 'Confirm Password' }}
              />
            </Stack>

            {/* ── Terms Checkbox ─────────────────────────── */}
            {/* → ConnectUI: FormControlLabel + Checkbox */}
            <FormControlLabel
              control={
                <Checkbox
                  checked={agreed}
                  onChange={(e) => setAgreed(e.target.checked)}
                />
              }
              label="I agree to the terms and conditions"
            />

            {/* ── Primary CTA ────────────────────────────── */}
            {/* → ConnectUI: Button (contained, primary) | disabled-until-valid */}
            <Button
              variant="contained"
              fullWidth
              disabled={!formIsValid}
              onClick={onSubmit}
            >
              Create Account
            </Button>

            {/* ── Sign-in Link ───────────────────────────── */}
            {/* → ConnectUI: Typography body2 + Link */}
            <Typography variant="body2" align="center">
              Already have an account?{' '}
              <Link
                component="button"
                variant="body2"
                onClick={onSignIn}
                underline="hover"
                sx={{ color: '#424242', cursor: 'pointer' }}
              >
                Sign in
              </Link>
            </Typography>

          </Stack>
        </Paper>
      );
    }

    function SubmittedState({ onReset }) {
      return (
        <Paper sx={{ width: '100%', maxWidth: 460, p: 4, border: '1px solid #E0E0E0' }}>
          <Stack spacing={3}>
            <Typography variant="h5">Account Created</Typography>
            <Typography variant="body2" color="text.secondary">
              Account created — placeholder confirmation. In production this view would
              show next steps or redirect to the application.
            </Typography>
            <Button variant="outlined" onClick={onReset}>
              Reset
            </Button>
          </Stack>
        </Paper>
      );
    }

    function SignInPlaceholder({ onBack }) {
      return (
        <Paper sx={{ width: '100%', maxWidth: 460, p: 4, border: '1px solid #E0E0E0' }}>
          <Stack spacing={3}>
            <Typography variant="h5">Sign In</Typography>
            <Typography variant="body2" color="text.secondary">
              Sign-in screen — out of scope for this wireframe.
            </Typography>
            <Button variant="outlined" onClick={onBack}>
              Back
            </Button>
          </Stack>
        </Paper>
      );
    }

    function App() {
      const [view, setView]         = React.useState('form');
      const [name, setName]         = React.useState('');
      const [email, setEmail]       = React.useState('');
      const [password, setPassword] = React.useState('');
      const [confirm, setConfirm]   = React.useState('');
      const [agreed, setAgreed]     = React.useState(false);

      const formIsValid = Boolean(name && email && password && confirm && agreed);

      function handleReset() {
        setName('');
        setEmail('');
        setPassword('');
        setConfirm('');
        setAgreed(false);
        setView('form');
      }

      return (
        <Box
          sx={{
            minHeight: '100vh',
            bgcolor: '#F5F5F5',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            py: 6,
          }}
        >
          {/* ── Motion: view-swap → Fade 200ms */}
          <Fade in={view === 'form'} timeout={200} unmountOnExit>
            <Box sx={{ width: '100%', display: 'flex', justifyContent: 'center', px: 2 }}>
              <CreateAccountForm
                name={name}
                setName={setName}
                email={email}
                setEmail={setEmail}
                password={password}
                setPassword={setPassword}
                confirm={confirm}
                setConfirm={setConfirm}
                agreed={agreed}
                setAgreed={setAgreed}
                formIsValid={formIsValid}
                onSubmit={() => setView('submitted')}
                onSignIn={() => setView('signin-placeholder')}
              />
            </Box>
          </Fade>

          <Fade in={view === 'submitted'} timeout={200} unmountOnExit>
            <Box sx={{ width: '100%', display: 'flex', justifyContent: 'center', px: 2 }}>
              <SubmittedState onReset={handleReset} />
            </Box>
          </Fade>

          <Fade in={view === 'signin-placeholder'} timeout={200} unmountOnExit>
            <Box sx={{ width: '100%', display: 'flex', justifyContent: 'center', px: 2 }}>
              <SignInPlaceholder onBack={() => setView('form')} />
            </Box>
          </Fade>
        </Box>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ThemeProvider theme={theme}>
        <App />
      </ThemeProvider>
    );
  </script>
</body>
</html>
