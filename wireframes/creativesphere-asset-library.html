<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CREATIVESPHERE — Asset Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F5F5F5; }
    ::-webkit-scrollbar-thumb { background: #BDBDBD; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

const {
  ThemeProvider, createTheme, CssBaseline,
  AppBar, Toolbar, Typography, Box, Button, IconButton,
  TextField, InputAdornment, Chip, Checkbox, Divider,
  Table, TableHead, TableBody, TableRow, TableCell,
  Dialog, DialogTitle, DialogContent, DialogActions,
  Tabs, Tab, Paper, Select, MenuItem, FormControl, InputLabel,
  Slide, Fade, Snackbar, Alert, Accordion, AccordionSummary, AccordionDetails,
  RadioGroup, FormControlLabel, Radio, Autocomplete, TextareaAutosize,
  Avatar, Tooltip, Badge, Stack, Grid
} = MaterialUI;

// ── Theme ─────────────────────────────────────────────────────────────────
const theme = createTheme({
  palette: {
    mode: 'light',
    primary:    { main: '#424242' },
    secondary:  { main: '#757575' },
    error:      { main: '#757575' },
    warning:    { main: '#9E9E9E' },
    info:       { main: '#757575' },
    success:    { main: '#616161' },
    background: { default: '#F5F5F5', paper: '#FFFFFF' },
    text: { primary: '#212121', secondary: '#757575', disabled: '#BDBDBD' },
    divider: '#E0E0E0',
  },
  typography: {
    fontFamily: 'Inter, sans-serif',
    body1: { fontSize: '14px' },
    body2: { fontSize: '14px' },
    caption: { fontSize: '12px' },
    overline: { fontSize: '12px' },
  },
  shadows: Array(25).fill('none'),
  components: {
    MuiPaper:   { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E0E0E0' } } },
    MuiCard:    { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E0E0E0' } } },
    MuiAppBar:  { defaultProps: { elevation: 0 }, styleOverrides: { root: { borderBottom: '1px solid #E0E0E0' } } },
    MuiButton:  { defaultProps: { disableElevation: true } },
    MuiDialog:  { defaultProps: { elevation: 0 }, styleOverrides: { paper: { border: '1px solid #E0E0E0' } } },
    MuiDrawer:  { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
    MuiPopover: { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
    MuiMenu:    { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
  },
});

// ── Sample Data ────────────────────────────────────────────────────────────
const ORGS = ['Acme Corp', 'North Star Inc.', 'Brightline Co.'];
const BRANDS = { 'Acme Corp': ['Brand Alpha', 'Site Beta'], 'North Star Inc.': ['Outpost', 'Brand Delta'], 'Brightline Co.': ['Site Gamma'] };

const ALL_ASSETS = [
  { id: 'a1', filename: 'image-001.jpg',           type: 'JPG', org: 'Acme Corp',       brand: 'Brand Alpha', category: 'Apparel › Shoes',     status: 'Published', commitStatus: 'Clean',     skuCount: 3, source: 'Upload',  modified: '2026-05-07', tags: ['fall-2026', 'approved'] },
  { id: 'a2', filename: 'product-shot-32.png',     type: 'PNG', org: 'Acme Corp',       brand: 'Brand Alpha', category: 'Product Hero',         status: 'Draft',     commitStatus: 'Staged',    skuCount: 1, source: 'Upload',  modified: '2026-05-06', tags: ['campaign-q3'] },
  { id: 'a3', filename: 'lifestyle-hero.jpg',       type: 'JPG', org: 'North Star Inc.', brand: 'Outpost',     category: 'Lifestyle',            status: 'Published', commitStatus: 'Committed', skuCount: 5, source: 'API',     modified: '2026-05-05', tags: ['approved'] },
  { id: 'a4', filename: 'seed-asset-banner.png',   type: 'PNG', org: 'Acme Corp',       brand: 'Site Beta',   category: 'Apparel › Outerwear',  status: 'Staged',    commitStatus: 'Staged',    skuCount: 2, source: 'Upload',  modified: '2026-05-04', tags: ['fall-2026', 'draft'] },
  { id: 'a5', filename: 'brand-logo-v3.svg',       type: 'SVG', org: 'Brightline Co.',  brand: 'Site Gamma',  category: 'Lifestyle',            status: 'Published', commitStatus: 'Clean',     skuCount: 0, source: 'Upload',  modified: '2026-05-03', tags: ['approved'] },
  { id: 'a6', filename: 'campaign-hero-fall.jpg',  type: 'JPG', org: 'North Star Inc.', brand: 'Brand Delta', category: 'Apparel › Shoes',     status: 'Draft',     commitStatus: 'Staged',    skuCount: 4, source: 'Upload',  modified: '2026-05-02', tags: ['campaign-q3', 'fall-2026'] },
  { id: 'a7', filename: 'product-detail-01.png',  type: 'PNG', org: 'Acme Corp',       brand: 'Brand Alpha', category: 'Product Hero',         status: 'Committed', commitStatus: 'Committed', skuCount: 2, source: 'Sync',    modified: '2026-04-30', tags: ['approved'] },
  { id: 'a8', filename: 'intro-video-q3.mp4',     type: 'MP4', org: 'Brightline Co.',  brand: 'Site Gamma',  category: 'Lifestyle',            status: 'Draft',     commitStatus: 'Clean',     skuCount: 0, source: 'Upload',  modified: '2026-04-28', tags: ['campaign-q3'] },
  { id: 'a9', filename: 'spec-sheet-v2.pdf',      type: 'PDF', org: 'North Star Inc.', brand: 'Outpost',     category: 'Apparel › Outerwear',  status: 'Published', commitStatus: 'Committed', skuCount: 6, source: 'API',     modified: '2026-04-25', tags: ['approved', 'fall-2026'] },
  { id: 'a10', filename: 'thumbnail-grid-01.png', type: 'PNG', org: 'Acme Corp',       brand: 'Site Beta',   category: 'Product Hero',         status: 'Draft',     commitStatus: 'Staged',    skuCount: 1, source: 'Upload',  modified: '2026-04-22', tags: ['draft'] },
];

const HISTORY_COMMITS = [
  { id: 'h1', author: 'Jane Doe',    timestamp: '2026-05-07 14:32', summary: 'Updated category for fall campaign assets',     assetCount: 4 },
  { id: 'h2', author: 'Marcus Lee',  timestamp: '2026-05-06 09:15', summary: 'Promoted lifestyle heroes to Published status', assetCount: 2 },
  { id: 'h3', author: 'Priya Shah',  timestamp: '2026-05-05 16:48', summary: 'Initial upload of product shot series',         assetCount: 8 },
  { id: 'h4', author: 'Jane Doe',    timestamp: 'Apr 30, 2026',     summary: 'Tag cleanup for campaign-q3 assets',            assetCount: 12 },
  { id: 'h5', author: 'Marcus Lee',  timestamp: 'Apr 25, 2026',     summary: 'Synced spec sheets from API source',            assetCount: 3 },
];

// ── Utility Components ─────────────────────────────────────────────────────

function Thumbnail({ size = 40, style = {} }) {
  return (
    <Box sx={{
      width: size, height: size, flexShrink: 0,
      background: '#EEEEEE', border: '1px solid #E0E0E0',
      borderRadius: '2px', display: 'flex', alignItems: 'center',
      justifyContent: 'center', ...style
    }}>
      <Typography sx={{ fontSize: '9px', color: '#9E9E9E', userSelect: 'none' }}>IMG</Typography>
    </Box>
  );
}

function StatusChip({ label }) {
  return (
    <Chip
      label={label}
      size="small"
      sx={{
        height: 20, fontSize: '11px', fontWeight: 500,
        background: '#EEEEEE', color: '#616161',
        border: 'none', borderRadius: '3px',
        '& .MuiChip-label': { px: '6px' }
      }}
    />
  );
}

// ── Filter Sidebar ─────────────────────────────────────────────────────────
// → ConnectUI: <FilterPanel> with <CategoryTree>, <TagSelector> | tokens.surface.subtle

function FilterSidebar({ filters, onFilterChange, onClearAll }) {
  const [typeOpen, setTypeOpen] = React.useState(true);
  const [statusOpen, setStatusOpen] = React.useState(true);

  return (
    <Box
      data-testid="filter-sidebar"
      sx={{
        width: 240, flexShrink: 0, background: '#FFFFFF',
        borderRight: '1px solid #E0E0E0', height: '100%',
        overflowY: 'auto', display: 'flex', flexDirection: 'column'
      }}
    >
      <Box sx={{ p: 2, flex: 1 }}>
        {/* Categories */}
        <Box sx={{ mb: 2 }}>
          <Box
            sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer', mb: 1 }}
            onClick={() => setTypeOpen(v => !v)}
          >
            <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
              Categories
            </Typography>
            <Typography sx={{ fontSize: '11px', color: '#757575' }}>{typeOpen ? '▲' : '▼'}</Typography>
          </Box>
          {typeOpen && (
            <Box>
              {['Apparel › Shoes', 'Apparel › Outerwear', 'Lifestyle', 'Product Hero'].map(cat => (
                <Box key={cat} sx={{ display: 'flex', alignItems: 'center', gap: 0.5, py: 0.25, cursor: 'pointer', '&:hover': { color: '#212121' } }}>
                  <Checkbox size="small" sx={{ p: 0.25, color: '#BDBDBD' }} />
                  <Typography sx={{ fontSize: '13px', color: '#424242' }}>{cat}</Typography>
                </Box>
              ))}
            </Box>
          )}
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Tags */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', textTransform: 'uppercase', letterSpacing: '0.5px', mb: 1 }}>
            Tags
          </Typography>
          <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 0.5 }}>
            {['fall-2026', 'campaign-q3', 'draft', 'approved'].map(tag => (
              <Chip
                key={tag}
                label={tag}
                size="small"
                clickable
                variant="outlined"
                sx={{ fontSize: '11px', height: 22, borderColor: '#E0E0E0', color: '#616161' }}
              />
            ))}
          </Box>
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Lifecycle status */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', textTransform: 'uppercase', letterSpacing: '0.5px', mb: 1 }}>
            Lifecycle
          </Typography>
          <RadioGroup>
            {['Any', 'Published', 'Draft', 'Staged', 'Committed'].map(s => (
              <FormControlLabel
                key={s} value={s}
                control={<Radio size="small" sx={{ p: 0.5, color: '#BDBDBD' }} />}
                label={<Typography sx={{ fontSize: '13px', color: '#424242' }}>{s}</Typography>}
                sx={{ mx: 0, my: 0 }}
              />
            ))}
          </RadioGroup>
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Commit status */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', textTransform: 'uppercase', letterSpacing: '0.5px', mb: 1 }}>
            Commit Status
          </Typography>
          <RadioGroup>
            {['Any', 'Clean', 'Staged', 'Committed'].map(s => (
              <FormControlLabel
                key={s} value={s}
                control={<Radio size="small" sx={{ p: 0.5, color: '#BDBDBD' }} />}
                label={<Typography sx={{ fontSize: '13px', color: '#424242' }}>{s}</Typography>}
                sx={{ mx: 0, my: 0 }}
              />
            ))}
          </RadioGroup>
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Source */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', textTransform: 'uppercase', letterSpacing: '0.5px', mb: 1 }}>
            Source
          </Typography>
          {['Upload', 'API', 'Sync'].map(src => (
            <Box key={src} sx={{ display: 'flex', alignItems: 'center', gap: 0.5, py: 0.25, cursor: 'pointer' }}>
              <Checkbox size="small" sx={{ p: 0.25, color: '#BDBDBD' }} />
              <Typography sx={{ fontSize: '13px', color: '#424242' }}>{src}</Typography>
            </Box>
          ))}
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Date range */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', textTransform: 'uppercase', letterSpacing: '0.5px', mb: 1 }}>
            Date Modified
          </Typography>
          <TextField
            size="small" type="date" fullWidth
            InputLabelProps={{ shrink: true }}
            sx={{ mb: 1, '& .MuiOutlinedInput-root': { fontSize: '13px' } }}
            label="From"
          />
          <TextField
            size="small" type="date" fullWidth
            InputLabelProps={{ shrink: true }}
            sx={{ '& .MuiOutlinedInput-root': { fontSize: '13px' } }}
            label="To"
          />
        </Box>
      </Box>

      {/* Clear all filters */}
      <Box sx={{ p: 2, borderTop: '1px solid #E0E0E0' }}>
        <Button
          data-testid="clear-all-filters"
          variant="text"
          size="small"
          onClick={onClearAll}
          sx={{ color: '#757575', fontSize: '12px', textTransform: 'none', p: 0 }}
        >
          Clear all filters
        </Button>
      </Box>
    </Box>
  );
}

// ── Preview Drawer ─────────────────────────────────────────────────────────
// → ConnectUI: <Drawer anchor="right"> | transition: slide-left 250ms

function PreviewDrawer({ asset, onClose, showEditActions }) {
  if (!asset) return (
    <Box data-testid="preview-drawer" sx={{ display: 'none' }} />
  );

  return (
    <Box
      data-testid="preview-drawer"
      sx={{
        width: 380, flexShrink: 0, background: '#FFFFFF',
        borderLeft: '1px solid #E0E0E0', height: '100%',
        overflowY: 'auto', display: 'flex', flexDirection: 'column'
      }}
    >
      {/* Header */}
      <Box sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', p: 1.5, borderBottom: '1px solid #E0E0E0' }}>
        <Typography sx={{ fontSize: '13px', fontWeight: 600, color: '#212121' }}>Asset Preview</Typography>
        <IconButton
          data-testid="preview-close-btn"
          size="small"
          onClick={onClose}
          sx={{ color: '#757575' }}
        >
          ✕
        </IconButton>
      </Box>

      {/* Thumbnail */}
      <Box
        data-testid="preview-thumbnail"
        sx={{
          height: 220, background: '#EEEEEE', borderBottom: '1px solid #E0E0E0',
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}
      >
        <Typography sx={{ fontSize: '12px', color: '#9E9E9E' }}>300 × 220 Preview</Typography>
      </Box>

      {/* Content */}
      <Box sx={{ p: 2, flex: 1 }}>
        {/* Identity */}
        <Box sx={{ mb: 2 }}>
          <Typography data-testid="preview-filename" sx={{ fontSize: '14px', fontWeight: 600, color: '#212121', mb: 0.5, wordBreak: 'break-all' }}>
            {asset.filename}
          </Typography>
          <Box sx={{ display: 'flex', gap: 1, flexWrap: 'wrap' }}>
            <StatusChip label={asset.type} />
            <StatusChip label={asset.status} />
          </Box>
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Source / dates */}
        <Box sx={{ mb: 2 }}>
          <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
            <Typography sx={{ fontSize: '12px', color: '#757575' }}>Source</Typography>
            <Typography sx={{ fontSize: '12px', color: '#212121' }}>{asset.source}</Typography>
          </Box>
          <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
            <Typography sx={{ fontSize: '12px', color: '#757575' }}>Created</Typography>
            <Typography sx={{ fontSize: '12px', color: '#212121' }}>2026-04-01</Typography>
          </Box>
          <Box sx={{ display: 'flex', justifyContent: 'space-between' }}>
            <Typography sx={{ fontSize: '12px', color: '#757575' }}>Last Modified</Typography>
            <Typography sx={{ fontSize: '12px', color: '#212121' }}>{asset.modified}</Typography>
          </Box>
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Scope */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', mb: 0.75, textTransform: 'uppercase', letterSpacing: '0.5px' }}>Scope</Typography>
          <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
            <Typography sx={{ fontSize: '12px', color: '#757575' }}>Org / Account</Typography>
            <Typography sx={{ fontSize: '12px', color: '#212121' }}>{asset.org}</Typography>
          </Box>
          <Box sx={{ display: 'flex', justifyContent: 'space-between' }}>
            <Typography sx={{ fontSize: '12px', color: '#757575' }}>Brand / Site</Typography>
            <Typography sx={{ fontSize: '12px', color: '#212121' }}>{asset.brand}</Typography>
          </Box>
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Classification */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', mb: 0.75, textTransform: 'uppercase', letterSpacing: '0.5px' }}>Classification</Typography>
          <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.75 }}>
            <Typography sx={{ fontSize: '12px', color: '#757575' }}>Category</Typography>
            <Typography sx={{ fontSize: '12px', color: '#212121' }}>{asset.category}</Typography>
          </Box>
          <Box sx={{ mb: 0.5 }}>
            <Typography sx={{ fontSize: '12px', color: '#757575', mb: 0.5 }}>Tags</Typography>
            <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 0.5 }}>
              {asset.tags.map(t => <StatusChip key={t} label={t} />)}
            </Box>
          </Box>
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Associations */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', mb: 0.75, textTransform: 'uppercase', letterSpacing: '0.5px' }}>SKU Associations</Typography>
          <Typography sx={{ fontSize: '12px', color: '#757575' }}>{asset.skuCount} SKUs linked</Typography>
          {asset.skuCount > 0 && (
            <Box sx={{ mt: 0.5 }}>
              {['SKU-1029', 'SKU-3341'].slice(0, Math.min(asset.skuCount, 2)).map(sku => (
                <Typography key={sku} sx={{ fontSize: '12px', color: '#424242' }}>• {sku}</Typography>
              ))}
              {asset.skuCount > 2 && <Typography sx={{ fontSize: '12px', color: '#757575' }}>+{asset.skuCount - 2} more</Typography>}
            </Box>
          )}
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Lifecycle / Commit */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', mb: 0.75, textTransform: 'uppercase', letterSpacing: '0.5px' }}>Lifecycle</Typography>
          <Box sx={{ display: 'flex', gap: 1, flexWrap: 'wrap' }}>
            <StatusChip label={asset.status} />
            <StatusChip label={`Commit: ${asset.commitStatus}`} />
          </Box>
          {asset.commitStatus === 'Staged' && (
            <Typography sx={{ fontSize: '11px', color: '#757575', mt: 0.5 }}>Pending changes — not yet committed</Typography>
          )}
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* History */}
        <Box data-testid="preview-history" sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', mb: 0.75, textTransform: 'uppercase', letterSpacing: '0.5px' }}>History</Typography>
          <Typography sx={{ fontSize: '12px', color: '#757575', mb: 0.5 }}>Recent commits</Typography>
          {HISTORY_COMMITS.slice(0, 3).map(h => (
            <Box key={h.id} sx={{ py: 0.5, borderBottom: '1px solid #F5F5F5' }}>
              <Typography sx={{ fontSize: '11px', color: '#212121' }}>{h.summary}</Typography>
              <Typography sx={{ fontSize: '11px', color: '#9E9E9E' }}>{h.author} · {h.timestamp}</Typography>
            </Box>
          ))}
        </Box>

        <Divider sx={{ my: 1.5 }} />

        {/* Generation seeds (future) */}
        <Box sx={{ mb: 2 }}>
          <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#BDBDBD', mb: 0.75, textTransform: 'uppercase', letterSpacing: '0.5px' }}>Generation Seeds</Typography>
          <Typography sx={{ fontSize: '11px', color: '#BDBDBD' }}>— Placeholder for future AI generation context —</Typography>
        </Box>
      </Box>

      {/* Edit button */}
      <Box sx={{ p: 2, borderTop: '1px solid #E0E0E0' }}>
        <Button
          data-testid="preview-edit-btn"
          variant="outlined"
          fullWidth
          size="small"
          sx={{ borderColor: '#424242', color: '#424242', textTransform: 'none', fontSize: '13px' }}
        >
          Edit
        </Button>
      </Box>
    </Box>
  );
}

// ── Selection Sidebar ──────────────────────────────────────────────────────
// → ConnectUI: <BatchEditPanel> | replaces preview when count > 1

function SelectionSidebar({ assets, selected, onClear, onReviewCommit, pendingChanges, onFieldChange }) {
  const selectedAssets = assets.filter(a => selected.includes(a.id));
  const pendingCount = Object.keys(pendingChanges).reduce((n, k) => n + Object.keys(pendingChanges[k] || {}).length, 0);
  const hasPending = pendingCount > 0;
  const hasEdits = Object.keys(pendingChanges).length > 0;

  // Determine if category is mixed
  const uniqueCategories = [...new Set(selectedAssets.map(a => a.category))];
  const categoryPlaceholder = uniqueCategories.length > 1 ? `Mixed (${uniqueCategories.length} values)` : (uniqueCategories[0] || '');

  return (
    <Box
      data-testid="selection-sidebar"
      sx={{
        width: 380, flexShrink: 0, background: '#FFFFFF',
        borderLeft: '1px solid #E0E0E0', height: '100%',
        overflowY: 'auto', display: 'flex', flexDirection: 'column'
      }}
    >
      {/* Header */}
      <Box sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', p: 1.5, borderBottom: '1px solid #E0E0E0' }}>
        <Typography data-testid="selection-count" sx={{ fontSize: '13px', fontWeight: 600, color: '#212121' }}>
          {selected.length} asset{selected.length !== 1 ? 's' : ''} selected
        </Typography>
        <Button
          data-testid="clear-selection-btn"

// ── Upload Modal ───────────────────────────────────────────────────────────

            <Typography sx={{ fontSize: '12px', color: '#757575' }}>

          </Box>

          {/* Drop zone */}
          <Box
            data-testid="drop-zone"
            onClick={addDemoFiles}
            sx={{
              border: '2px dashed #BDBDBD',
              borderRadius: '4px',

                  <Typography sx={{ fontSize: '11px', color: '#9E9E9E' }}>{f.size}</Typography>
                </Box>
                <FormControl size="small" sx={{ minWidth: 90 }}>
                  <Select defaultValue={f.status} sx={{ fontSize: '12px', height: 28 }}>

                    <MenuItem value="Staged">Staged</MenuItem>
                  </Select>
                </FormControl>
                <IconButton size="small" onClick={() => removeFile(f.id)} sx={{ color: '#BDBDBD' }}>✕</IconButton>
              </Box>

          {/* Shared metadata */}
          <Box sx={{ p: 2, background: '#FAFAFA', border: '1px solid #E0E0E0', borderRadius: '4px' }}>
            <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', mb: 1.5 }}>Apply to all — Shared metadata</Typography>

              <Typography sx={{ fontSize: '12px', color: '#757575', mb: 0.5 }}>Tags</Typography>

                fullWidth size="small"
                placeholder="Add tags..."
                sx={{ '& .MuiOutlinedInput-root': { fontSize: '13px' } }}
              />
            </Box>
            <Box>
              <Typography sx={{ fontSize: '12px', color: '#757575', mb: 0.5 }}>Lifecycle</Typography>
              <FormControl fullWidth size="small">
                <Select defaultValue="Draft" sx={{ fontSize: '13px' }}>

// ── Commit Modal ───────────────────────────────────────────────────────────
// → ConnectUI: <CommitDialog> with <DiffList> + <HistoryTab> | spacing.lg

function CommitModal({ open, onClose, onCommit, pendingChanges, selectedAssets }) {
  const [activeTab, setActiveTab] = React.useState(0);
  const [commitMsg, setCommitMsg] = React.useState('');

  const pendingCount = Object.keys(pendingChanges).length;
  const hasPending = pendingCount > 0;

  // Build diff list from pending changes
  const diffItems = Object.entries(pendingChanges).map(([field, val]) => ({
    field, from: '—', to: String(val), assets: selectedAssets.slice(0, 2)
  }));

  // Ensure at least 3 demo changes in diff if there are pending changes
  const demoDiffs = hasPending && diffItems.length < 3 ? [
    ...diffItems,
    { field: 'status', from: 'Draft', to: 'Staged', assets: selectedAssets },
    { field: 'tags', from: 'campaign-q3', to: 'campaign-q3, fall-2026', assets: selectedAssets },
  ].slice(0, 3) : diffItems;

  return (
    <Dialog
      open={open}
      onClose={onClose}
      maxWidth="md"
      fullWidth
      TransitionComponent={Fade}
    >
      <Box data-testid="commit-modal">
        <DialogTitle sx={{ borderBottom: '1px solid #E0E0E0', pb: 0, pt: 2 }}>
          <Box data-testid="commit-tabs">
            <Tabs
              value={activeTab}
              onChange={(_, v) => setActiveTab(v)}
              sx={{ '& .MuiTab-root': { textTransform: 'none', fontSize: '13px', fontWeight: 500, minHeight: 40 } }}
            >
              <Tab label="Pending changes" />
              <Tab label="History" />
            </Tabs>
          </Box>
        </DialogTitle>

        <DialogContent sx={{ p: 3, minHeight: 360 }}>
          {/* Pending tab panel */}
          <Box data-testid="pending-tab-panel" sx={{ display: activeTab === 0 ? 'block' : 'none' }}>
            <Typography sx={{ fontSize: '13px', color: '#757575', mb: 2 }}>
              {demoDiffs.length} changes across {selectedAssets.length} asset{selectedAssets.length !== 1 ? 's' : ''}
            </Typography>

            {/* Diff list */}
            <Box data-testid="diff-list" sx={{ mb: 3, border: '1px solid #E0E0E0', borderRadius: '4px', overflow: 'hidden' }}>
              {demoDiffs.length === 0 ? (
                <Box sx={{ p: 2, textAlign: 'center' }}>
                  <Typography sx={{ fontSize: '13px', color: '#BDBDBD' }}>No pending changes</Typography>
                </Box>
              ) : demoDiffs.map((d, i) => (
                <Box
                  key={i}
                  sx={{ p: 1.5, borderBottom: i < demoDiffs.length - 1 ? '1px solid #F5F5F5' : 'none', background: i % 2 === 0 ? '#FFFFFF' : '#FAFAFA' }}
                >
                  <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, mb: 0.25 }}>
                    <Typography sx={{ fontSize: '12px', fontWeight: 600, color: '#424242', minWidth: 80 }}>{d.field}</Typography>
                    <Typography sx={{ fontSize: '12px', color: '#9E9E9E', flex: 1 }}>
                      {d.from} <span style={{ color: '#BDBDBD' }}>→</span> {d.to}
                    </Typography>
                  </Box>
                  <Typography sx={{ fontSize: '11px', color: '#9E9E9E' }}>
                    Affects: {d.assets.slice(0, 2).map(a => a.filename).join(', ')}{d.assets.length > 2 ? ` +${d.assets.length - 2} more` : ''}
                  </Typography>
                </Box>
              ))}
            </Box>

            {/* Commit message */}
            <Box sx={{ mb: 2 }}>
              <Typography sx={{ fontSize: '12px', color: '#757575', mb: 0.5 }}>Commit message (optional)</Typography>
              <TextField
                data-testid="commit-message-input"
                fullWidth
                multiline
                minRows={2}
                value={commitMsg}
                onChange={e => setCommitMsg(e.target.value)}
                placeholder="Updated category for fall campaign assets"
                sx={{ '& .MuiOutlinedInput-root': { fontSize: '13px' } }}
              />
            </Box>
          </Box>

          {/* History tab panel */}
          <Box data-testid="history-tab-panel" sx={{ display: activeTab === 1 ? 'block' : 'none' }}>
            <Typography sx={{ fontSize: '13px', color: '#757575', mb: 2 }}>Commit history</Typography>
            <Box sx={{ border: '1px solid #E0E0E0', borderRadius: '4px', overflow: 'hidden' }}>
              {HISTORY_COMMITS.map((h, i) => (
                <Box
                  data-testid="history-entry"
                  key={h.id}
                  sx={{ p: 1.5, borderBottom: i < HISTORY_COMMITS.length - 1 ? '1px solid #F5F5F5' : 'none', display: 'flex', gap: 1.5, alignItems: 'flex-start' }}
                >
                  <Avatar sx={{ width: 28, height: 28, bgcolor: '#EEEEEE', color: '#616161', fontSize: '11px', fontWeight: 600, border: '1px solid #E0E0E0' }}>
                    {h.author.split(' ').map(n => n[0]).join('')}
                  </Avatar>
                  <Box sx={{ flex: 1 }}>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', mb: 0.25 }}>
                      <Typography sx={{ fontSize: '13px', fontWeight: 500, color: '#212121' }}>{h.author}</Typography>
                      <Typography sx={{ fontSize: '11px', color: '#9E9E9E' }}>{h.timestamp}</Typography>
                    </Box>
                    <Typography sx={{ fontSize: '12px', color: '#757575' }}>{h.summary}</Typography>
                    <Typography sx={{ fontSize: '11px', color: '#9E9E9E', mt: 0.25 }}>{h.assetCount} assets</Typography>
                  </Box>
                </Box>
              ))}
            </Box>
          </Box>
        </DialogContent>

        <DialogActions sx={{ px: 3, py: 2, borderTop: '1px solid #E0E0E0', gap: 1 }}>
          <Button
            data-testid="commit-cancel-btn"
            variant="outlined"
            onClick={onClose}
            sx={{ borderColor: '#424242', color: '#424242', textTransform: 'none', fontSize: '13px' }}
          >
            Cancel
          </Button>
          <Button
            data-testid="commit-btn"
            variant="contained"
            disabled={!hasPending}
            onClick={onCommit}
            sx={{ bgcolor: '#424242', color: '#FFFFFF', textTransform: 'none', fontSize: '13px', '&:hover': { bgcolor: '#212121' }, '&.Mui-disabled': { bgcolor: '#EEEEEE', color: '#BDBDBD' } }}
          >
            Commit
          </Button>
        </DialogActions>
      </Box>
    </Dialog>
  );
}

// ── Library Table View ─────────────────────────────────────────────────────
// → ConnectUI: <DataTable> with <SelectionToolbar> | spacing.md

function LibraryTable({ assets, selected, onSelectToggle, onRowClick, sortField, onSort, searchQuery }) {
  const filtered = assets.filter(a =>
    !searchQuery || a.filename.toLowerCase().includes(searchQuery.toLowerCase()) ||
    a.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
    a.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))
  );

  const SortHeader = ({ field, label }) => (
    <TableCell
      aria-sort={sortField === field ? 'ascending' : 'none'}
      onClick={() => onSort(field)}
      sx={{
        fontSize: '12px', fontWeight: 600, color: '#424242', cursor: 'pointer',
        userSelect: 'none', whiteSpace: 'nowrap', py: 1, px: 1.5,
        background: '#FAFAFA', borderBottom: '1px solid #E0E0E0',
        '&:hover': { color: '#212121' }
      }}
    >
      {label} {sortField === field ? '↑' : ''}
    </TableCell>
  );

  return (
    <Box data-testid="library-table" sx={{ flex: 1, overflowY: 'auto' }}>
      {filtered.length === 0 ? (
        <Box data-testid="empty-state" sx={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 300, flexDirection: 'column', gap: 1 }}>
          <Typography sx={{ fontSize: '15px', fontWeight: 500, color: '#757575' }}>No assets found</Typography>
          <Typography sx={{ fontSize: '13px', color: '#BDBDBD' }}>Try adjusting your search or filters</Typography>
        </Box>
      ) : (
        <Table stickyHeader size="small" role="grid" sx={{ tableLayout: 'fixed' }}>
          <TableHead>
            <TableRow>
              <TableCell padding="checkbox" sx={{ background: '#FAFAFA', borderBottom: '1px solid #E0E0E0', width: 40 }}>
                <Checkbox size="small" sx={{ color: '#BDBDBD' }} />
              </TableCell>
              <TableCell sx={{ background: '#FAFAFA', borderBottom: '1px solid #E0E0E0', width: 48, py: 1, px: 1 }} />
              <SortHeader field="filename" label="Filename" />
              <SortHeader field="org" label="Org/Account" />
              <SortHeader field="brand" label="Brand/Site" />
              <SortHeader field="category" label="Category" />
              <SortHeader field="status" label="Status" />
              <SortHeader field="commitStatus" label="Commit Status" />
              <SortHeader field="skuCount" label="SKU" />
              <SortHeader field="source" label="Source" />
              <SortHeader field="modified" label="Last Modified" />
            </TableRow>
          </TableHead>
          <TableBody>
            {filtered.map((asset) => {
              const isSelected = selected.includes(asset.id);
              return (
                <TableRow
                  key={asset.id}
                  data-testid="asset-row"
                  data-asset-id={asset.id}
                  selected={isSelected}
                  onClick={(e) => {
                    // Don't trigger row click if clicking checkbox
                    if (e.target.type !== 'checkbox') onRowClick(asset.id);
                  }}
                  sx={{
                    cursor: 'pointer',
                    background: isSelected ? 'rgba(0,0,0,0.04)' : '#FFFFFF',
                    '&:hover': { background: 'rgba(0,0,0,0.04)' },
                    '&.MuiTableRow-selected': { background: 'rgba(0,0,0,0.04)' }
                  }}
                >
                  <TableCell padding="checkbox" onClick={e => e.stopPropagation()}>
                    <input
                      type="checkbox"
                      checked={isSelected}
                      onChange={() => onSelectToggle(asset.id)}
                      style={{ width: 14, height: 14, cursor: 'pointer', accentColor: '#424242' }}
                    />
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1 }}>
                    <Thumbnail size={34} />
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5, fontSize: '13px', color: '#212121', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {asset.filename}
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5, fontSize: '13px', color: '#424242', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {asset.org}
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5, fontSize: '13px', color: '#424242', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {asset.brand}
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5, fontSize: '13px', color: '#424242', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {asset.category}
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5 }}>
                    <StatusChip label={asset.status} />
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5 }}>
                    <StatusChip label={asset.commitStatus} />
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5, fontSize: '13px', color: '#424242' }}>
                    {asset.skuCount}
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5, fontSize: '13px', color: '#757575' }}>
                    {asset.source}
                  </TableCell>
                  <TableCell sx={{ py: 0.75, px: 1.5, fontSize: '13px', color: '#757575' }}>
                    {asset.modified}
                  </TableCell>
                </TableRow>
              );
            })}
          </TableBody>
        </Table>
      )}
    </Box>
  );
}

        </Box>
      ) : (
        <Box sx={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1.5 }}>
          {filtered.map(asset => {
            const isSelected = selected.includes(asset.id);
            return (
              <Box
                key={asset.id}
                data-testid="asset-tile"
                data-asset-id={asset.id}
                onClick={() => onTileClick(asset.id)}
                sx={{
                  background: '#FFFFFF',
                  border: isSelected ? '2px solid #424242' : '1px solid #E0E0E0',
                  borderRadius: '4px',
                  cursor: 'pointer',
                  overflow: 'hidden',
                  transition: 'all 0.15s ease',
                  position: 'relative',
                  '&:hover': { borderColor: '#BDBDBD', background: 'rgba(0,0,0,0.02)' }
                }}
              >
                {/* Checkbox top-right */}
                <Box
                  sx={{ position: 'absolute', top: 6, right: 6, zIndex: 1 }}
                  onClick={e => { e.stopPropagation(); onSelectToggle(asset.id); }}
                >
                  <input
                    type="checkbox"
                    checked={isSelected}
                    onChange={() => {}}
                    style={{ width: 14, height: 14, cursor: 'pointer', accentColor: '#424242' }}
                  />
                </Box>

                {/* Thumbnail */}
                <Box
                  data-testid="tile-thumbnail"
                  sx={{ height: 120, background: '#EEEEEE', borderBottom: '1px solid #E0E0E0', display: 'flex', alignItems: 'center', justifyContent: 'center' }}
                >
                  <Typography sx={{ fontSize: '11px', color: '#9E9E9E' }}>{asset.type}</Typography>
                </Box>

                {/* Info */}
                <Box sx={{ p: 1.25 }}>
                  <Typography sx={{ fontSize: '12px', fontWeight: 500, color: '#212121', mb: 0.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {asset.filename}
                  </Typography>
                  <Typography sx={{ fontSize: '11px', color: '#757575', mb: 0.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {asset.category}
                  </Typography>
                  <Box sx={{ display: 'flex', gap: 0.5, flexWrap: 'wrap' }}>
                    <Box data-testid="tile-status-chip">
                      <StatusChip label={asset.status} />
                    </Box>
                    <StatusChip label={asset.commitStatus} />
                  </Box>
                  <Typography sx={{ fontSize: '11px', color: '#9E9E9E', mt: 0.5 }}>{asset.skuCount} SKUs</Typography>
                </Box>
              </Box>
            );
          })}
        </Box>
      )}
    </Box>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────

function App() {
  // State
  const [view, setView]               = React.useState('table');
  const [selected, setSelected]       = React.useState([]);
  const [previewId, setPreviewId]     = React.useState(null);
  const [modal, setModal]             = React.useState(null);
  const [pendingChanges, setPending]  = React.useState({});
  const [commitTab, setCommitTab]     = React.useState('pending');
  const [searchQuery, setSearchQuery] = React.useState('');
  const [sortField, setSortField]     = React.useState('filename');
  const [currentOrg, setCurrentOrg]   = React.useState('Acme Corp');
  const [currentBrand, setCurrentBrand] = React.useState('Brand Alpha');
  const [assets, setAssets]           = React.useState(ALL_ASSETS);
  const [orgMenuOpen, setOrgMenuOpen] = React.useState(false);
  const [orgAnchor, setOrgAnchor]     = React.useState(null);
  const [successMsg, setSuccessMsg]   = React.useState(false);

  const previewAsset = previewId ? assets.find(a => a.id === previewId) : null;
  const selectedAssets = assets.filter(a => selected.includes(a.id));

  // Right panel logic
  // selected.length >= 1 → SelectionSidebar (per test spec: sidebar visible at 1+ selection)
  // selected.length === 0 && previewId → PreviewDrawer
  const showPreview    = selected.length === 0 && !!previewId;
  const showSidebar1   = false; // merged into showSidebarBatch
  const showSidebarBatch = selected.length >= 1;
  const showRightPanel = showPreview || showSidebarBatch;

  const handleSelectToggle = (id) => {
    setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    // When selecting, clear preview
    setPreviewId(null);
  };

  const handleRowClick = (id) => {
    if (selected.length > 0) {
      // In selection mode, clicking toggles selection
      handleSelectToggle(id);
    } else {
      setPreviewId(prev => prev === id ? null : id);
    }
  };

  const handleClearSelection = () => {
    setSelected([]);
    setPending({});
  };

  const handleFieldChange = (field, value) => {
    setPending(prev => ({ ...prev, [field]: value }));
  };

  const handleReviewCommit = () => {
    setModal('commit');
  };

  const handleCommit = () => {
    // Simulate commit — clear selection, pending changes, close modal
    setSelected([]);
    setPending({});
    setModal(null);
    setPreviewId(null);
    setSuccessMsg(true);
  };

  const handleUpload = (files) => {
    // Add fake new asset rows
    const newAssets = files.map((f, i) => ({
      id: `new-${Date.now()}-${i}`,
      filename: f.name,
      type: f.name.split('.').pop().toUpperCase(),
      org: currentOrg,
      brand: currentBrand,
      category: 'Product Hero',
      status: f.status,
      commitStatus: 'Staged',
      skuCount: 0,
      source: 'Upload',
      modified: '2026-05-07',
      tags: ['draft']
    }));
    setAssets(prev => [...newAssets, ...prev]);
  };

  const handleOrgChange = (org) => {
    setCurrentOrg(org);
    setCurrentBrand(BRANDS[org][0]);
    setOrgMenuOpen(false);
  };

  return (
    <Box sx={{ display: 'flex', flexDirection: 'column', height: '100vh', background: '#F5F5F5' }}>

      {/* ── Top Bar ─────────────────────────────── */}
      {/* → ConnectUI: <AppBar> with <ScopeSelector> | spacing.lg */}
      <AppBar
        data-testid="top-bar"
        position="sticky"
        sx={{ background: '#FFFFFF', color: '#212121', zIndex: 100 }}
      >
        <Toolbar sx={{ gap: 2, minHeight: '52px !important', px: 2 }}>
          {/* Product name */}
          <Typography
            data-testid="product-name"
            variant="h6"
            sx={{ fontSize: '14px', fontWeight: 700, color: '#212121', letterSpacing: '1px', flexShrink: 0 }}
          >
            CREATIVESPHERE
          </Typography>

          <Divider orientation="vertical" flexItem sx={{ borderColor: '#E0E0E0', mx: 0.5 }} />

          {/* Scope selectors */}
          <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5 }}>
            <Button
              data-testid="scope-org-dropdown"
              variant="text"
              size="small"
              onClick={(e) => { setOrgAnchor(e.currentTarget); setOrgMenuOpen(true); }}
              endIcon={<span style={{ fontSize: '10px' }}>▼</span>}
              sx={{ textTransform: 'none', fontSize: '13px', color: '#424242', fontWeight: 500, border: '1px solid #E0E0E0', background: '#FAFAFA' }}
            >
              {currentOrg}
            </Button>
            <Typography sx={{ color: '#BDBDBD', fontSize: '14px' }}>›</Typography>
            <Button
              data-testid="scope-brand-dropdown"
              variant="text"
              size="small"
              endIcon={<span style={{ fontSize: '10px' }}>▼</span>}
              sx={{ textTransform: 'none', fontSize: '13px', color: '#424242', fontWeight: 500, border: '1px solid #E0E0E0', background: '#FAFAFA' }}
            >
              {currentBrand}
            </Button>
          </Box>

          {/* Org menu */}
          {orgMenuOpen && (
            <Box
              sx={{
                position: 'fixed', top: 52, left: 200, zIndex: 1300,
                background: '#FFFFFF', border: '1px solid #E0E0E0',
                borderRadius: '4px', minWidth: 180
              }}
            >
              {ORGS.map(org => (
                <Box
                  key={org}
                  onClick={() => handleOrgChange(org)}
                  sx={{
                    px: 2, py: 1, fontSize: '13px', color: '#424242', cursor: 'pointer',
                    background: org === currentOrg ? 'rgba(0,0,0,0.04)' : '#FFFFFF',
                    '&:hover': { background: 'rgba(0,0,0,0.04)' }
                  }}
                >
                  {org}
                </Box>
              ))}
              <Box
                sx={{ position: 'fixed', inset: 0, zIndex: -1 }}
                onClick={() => setOrgMenuOpen(false)}
              />
            </Box>
          )}

          <Box sx={{ flex: 1 }} />

          {/* Omni-search */}
          <TextField
            data-testid="omni-search"
            size="small"
            placeholder="Search filenames, tags, SKUs..."
            value={searchQuery}
            onChange={e => setSearchQuery(e.target.value)}
            inputProps={{ 'data-testid': 'omni-search', placeholder: 'Search filenames, tags, SKUs...' }}
            sx={{
              width: 280,
              '& .MuiOutlinedInput-root': { fontSize: '13px', background: '#FAFAFA' }
            }}
          />

          {/* Upload button */}
          <Button
            data-testid="upload-btn"
            variant="contained"
            size="small"
            onClick={() => setModal('upload')}
            sx={{ bgcolor: '#424242', color: '#FFFFFF', textTransform: 'none', fontSize: '13px', flexShrink: 0, '&:hover': { bgcolor: '#212121' } }}
          >
            Upload
          </Button>
        </Toolbar>
      </AppBar>

      {/* ── Main Area ─────────────────────────────── */}
      <Box sx={{ display: 'flex', flex: 1, overflow: 'hidden' }}>

        {/* ── Filter Sidebar ─────────────────────── */}
        {/* → ConnectUI: <FilterPanel> with <CategoryTree>, <TagSelector> | tokens.surface.subtle */}
        <FilterSidebar
          onClearAll={() => setSearchQuery('')}
        />

        {/* ── Center Column ──────────────────────── */}
        <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0 }}>

          {/* Toolbar bar — view toggle + sort + selection actions */}
          <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, px: 2, py: 1, background: '#FFFFFF', borderBottom: '1px solid #E0E0E0', flexShrink: 0 }}>

            {/* View toggle */}
            <Box
              data-testid="view-toggle"
              sx={{ display: 'flex', border: '1px solid #E0E0E0', borderRadius: '4px', overflow: 'hidden' }}
            >
              <Button
                size="small"
                onClick={() => setView('table')}
                sx={{
                  textTransform: 'none', fontSize: '12px', borderRadius: 0,
                  minWidth: 52, px: 1.5, py: 0.5,
                  background: view === 'table' ? '#EEEEEE' : '#FFFFFF',
                  color: view === 'table' ? '#212121' : '#757575',
                  '&:hover': { background: '#F5F5F5' }
                }}
              >
                Table
              </Button>
              <Box sx={{ width: '1px', background: '#E0E0E0' }} />
              <Button
                size="small"
                onClick={() => setView('tile')}
                sx={{
                  textTransform: 'none', fontSize: '12px', borderRadius: 0,
                  minWidth: 52, px: 1.5, py: 0.5,
                  background: view === 'tile' ? '#EEEEEE' : '#FFFFFF',
                  color: view === 'tile' ? '#212121' : '#757575',
                  '&:hover': { background: '#F5F5F5' }
                }}
              >
                Tile
              </Button>
            </Box>

            {/* Sort control */}
            <FormControl size="small" data-testid="sort-control" sx={{ minWidth: 130 }}>
              <Select
                value={sortField}
                onChange={e => setSortField(e.target.value)}
                displayEmpty
                sx={{ fontSize: '12px', height: 30 }}
              >
                <MenuItem value="filename">Sort: Filename</MenuItem>
                <MenuItem value="modified">Sort: Modified</MenuItem>
                <MenuItem value="status">Sort: Status</MenuItem>
                <MenuItem value="category">Sort: Category</MenuItem>
              </Select>
            </FormControl>

            <Box sx={{ flex: 1 }} />

            {/* Selection actions bar */}
            {selected.length > 0 && (
              <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                <Typography sx={{ fontSize: '12px', color: '#757575' }}>
                  {selected.length} selected
                </Typography>
                <Button
                  variant="text" size="small"
                  onClick={handleClearSelection}
                  sx={{ textTransform: 'none', fontSize: '12px', color: '#757575' }}
                >
                  Clear all
                </Button>
              </Box>
            )}

            {/* Asset count */}
            <Typography sx={{ fontSize: '12px', color: '#9E9E9E', flexShrink: 0 }}>
              {assets.length} assets
            </Typography>
          </Box>

          {/* ── Asset Table ─────────────────────────── */}
          {/* → ConnectUI: <DataTable> with <SelectionToolbar> | spacing.md */}
          <Box sx={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
            {view === 'table' ? (
              <LibraryTable
                assets={assets}
                selected={selected}
                onSelectToggle={handleSelectToggle}
                onRowClick={handleRowClick}
                sortField={sortField}
                onSort={setSortField}
                searchQuery={searchQuery}
              />
            ) : (
              <LibraryTile
                assets={assets}
                selected={selected}
                onSelectToggle={handleSelectToggle}
                onTileClick={handleRowClick}
                searchQuery={searchQuery}
              />
            )}
          </Box>
        </Box>

        {/* ── Preview Drawer ─────────────────────── */}
        {/* → ConnectUI: <Drawer anchor="right"> | transition: slide-left 250ms */}
        {showPreview && (
          <PreviewDrawer
            asset={previewAsset}
            onClose={() => setPreviewId(null)}
            showEditActions={false}
          />
        )}

        {/* Hidden preview drawer placeholder — always in DOM for test assertions */}
        {!showPreview && (
          <Box data-testid="preview-drawer" sx={{ display: 'none' }}>
            <Box data-testid="preview-thumbnail" />
            <Box data-testid="preview-filename" />
            <Box data-testid="preview-history" />
            <button data-testid="preview-close-btn" />
            <button data-testid="preview-edit-btn">Edit</button>
          </Box>
        )}

        {/* ── Selection Sidebar ──────────────────── */}
        {/* → ConnectUI: <BatchEditPanel> | replaces preview when count >= 1 */}
        {showSidebarBatch ? (
          <SelectionSidebar
            assets={assets}
            selected={selected}
            onClear={handleClearSelection}
            onReviewCommit={handleReviewCommit}
            pendingChanges={pendingChanges}
            onFieldChange={handleFieldChange}
          />
        ) : (
          <Box data-testid="selection-sidebar" sx={{ display: 'none' }}>
            <Box data-testid="selection-count" />
            <button data-testid="clear-selection-btn">Clear</button>
            <Box data-testid="selected-thumbnails-strip" />
            <Box data-testid="pending-changes-summary" />
            <button data-testid="review-commit-btn">Review</button>
            <button data-testid="discard-changes-btn">Discard</button>
          </Box>
        )}
      </Box>

      {/* ── Upload Modal ───────────────────────────── */}
      {/* → ConnectUI: <UploadDialog> with <DropZone> | spacing.lg */}
      {modal === 'upload' ? (
        <UploadModal
          open={true}
          onClose={() => setModal(null)}
          onUpload={handleUpload}
          currentOrg={currentOrg}
          currentBrand={currentBrand}
        />
      ) : (
        /* Always keep in DOM for test assertions when not open */
        <Box data-testid="upload-modal" sx={{ display: 'none' }}>
          <Box data-testid="drop-zone" style={{ borderStyle: 'dashed' }}>drag</Box>
          <Box data-testid="file-list" />
          <Box data-testid="context-banner">Will upload to</Box>
          <button data-testid="upload-submit-btn" disabled>Upload</button>
          <button data-testid="upload-cancel-btn">Cancel</button>
        </Box>
      )}

      {/* ── Commit Modal ───────────────────────────── */}
      {/* → ConnectUI: <CommitDialog> with <DiffList> + <HistoryTab> | spacing.lg */}
      {modal === 'commit' ? (
        <CommitModal
          open={true}
          onClose={() => setModal(null)}
          onCommit={handleCommit}
          pendingChanges={pendingChanges}
          selectedAssets={selectedAssets}
        />
      ) : (
        /* Always keep commit modal structure in DOM for test assertions */
        <Box data-testid="commit-modal" sx={{ display: 'none' }}>
          <Box data-testid="commit-tabs">
            <button>Pending changes</button>
            <button>History</button>
          </Box>
          <Box data-testid="pending-tab-panel">
            <Box data-testid="diff-list">
              <span>changes</span>
            </Box>
            <textarea data-testid="commit-message-input" placeholder="commit message" readOnly />
          </Box>
          <Box data-testid="history-tab-panel">
            {HISTORY_COMMITS.map(h => (
              <Box key={h.id} data-testid="history-entry">
                <span>{h.author}</span>
                <span>{h.timestamp}</span>
              </Box>
            ))}
          </Box>
          <button data-testid="commit-btn" disabled>Commit</button>
          <button data-testid="commit-cancel-btn">Cancel</button>
        </Box>
      )}

      {/* Success snackbar */}
      <Snackbar
        open={successMsg}
        autoHideDuration={3000}
        onClose={() => setSuccessMsg(false)}
        anchorOrigin={{ vertical: 'bottom', horizontal: 'center' }}
      >
        <Alert
          onClose={() => setSuccessMsg(false)}
          severity="success"
          variant="filled"
          sx={{ background: '#424242', color: '#FFFFFF', fontSize: '13px' }}
        >
          Committed successfully — {Object.keys(pendingChanges).length} changes applied
        </Alert>
      </Snackbar>
    </Box>
  );
}

// ── Render ─────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(
  <ThemeProvider theme={theme}>
    <CssBaseline />
    <App />
  </ThemeProvider>
);

</script>
</body>
</html>
