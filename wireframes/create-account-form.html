<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Wireframe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      ThemeProvider,
      createTheme,
      CssBaseline,
      Container,
      Box,
      Stack,
      Typography,
      TextField,
      Button,
      Checkbox,
      FormControlLabel,
      Link,
      Fade,
    } = MaterialUI;

    // ── Theme ────────────────────────────────────────────────────────────────
    const theme = createTheme({
      palette: {
        mode: 'light',
        primary:    { main: '#424242' },
        secondary:  { main: '#757575' },
        error:      { main: '#757575' },
        warning:    { main: '#9E9E9E' },
        info:       { main: '#757575' },
        success:    { main: '#616161' },
        background: { default: '#F5F5F5', paper: '#FFFFFF' },
        text: { primary: '#212121', secondary: '#757575', disabled: '#BDBDBD' },
        divider: '#E0E0E0',
      },
      typography: { fontFamily: 'Inter, sans-serif' },
      shadows: Array(25).fill('none'),
      components: {
        MuiPaper:   { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E0E0E0' } } },
        MuiCard:    { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E0E0E0' } } },
        MuiAppBar:  { defaultProps: { elevation: 0 }, styleOverrides: { root: { borderBottom: '1px solid #E0E0E0' } } },
        MuiButton:  { defaultProps: { disableElevation: true } },
        MuiDialog:  { defaultProps: { elevation: 0 }, styleOverrides: { paper: { border: '1px solid #E0E0E0' } } },
        MuiDrawer:  { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
        MuiPopover: { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
        MuiMenu:    { styleOverrides: { paper: { border: '1px solid #E0E0E0', boxShadow: 'none' } } },
      },
    });

    // ── Create Account Form view ─────────────────────────────────────────────
    function CreateAccountForm({ agreed, onAgreedChange, onSubmit, onSignInClick }) {
      return (
        <Stack spacing={3}>

          {/* ── Page title ────────────────────────────── */}
          {/* → ConnectUI: <PageHeader> | typography.h4 */}
          <Typography variant="h4" component="h1">
            Create Account
          </Typography>

          <Typography variant="body2" color="text.secondary">
            Fill in the information below to continue.
          </Typography>

          {/* ── Form fields ───────────────────────────── */}
          {/* → ConnectUI: <Form> + <TextField> | spacing.md */}
          <TextField
            label="Full Name"
            fullWidth
            variant="outlined"
          />
          <TextField
            label="Email Address"
            type="email"
            fullWidth
            variant="outlined"
          />
          <TextField
            label="Password"
            type="password"
            fullWidth
            variant="outlined"
          />
          <TextField
            label="Confirm Password"
            type="password"
            fullWidth
            variant="outlined"
          />

          {/* ── Terms agreement ───────────────────────── */}
          {/* → ConnectUI: <Checkbox> + <Link> | spacing.sm */}
          <FormControlLabel
            control={
              <Checkbox
                checked={agreed}
                onChange={(e) => onAgreedChange(e.target.checked)}
              />
            }
            label="I agree to the terms and conditions"
          />

          {/* ── Primary action ────────────────────────── */}
          {/* → ConnectUI: <Button variant="primary"> | full-width */}
          <Button
            fullWidth
            variant="outlined"
            disabled={!agreed}
            onClick={onSubmit}
          >
            Create Account
          </Button>

          {/* ── Footer link ───────────────────────────── */}
          {/* → ConnectUI: <Link> | typography.body2 */}
          <Typography variant="body2" color="text.secondary" align="center">
            Already have an account?{' '}
            <Link
              component="button"
              variant="body2"
              onClick={onSignInClick}
              underline="hover"
            >
              Sign in
            </Link>
          </Typography>

        </Stack>
      );
    }

    // ── Sign-in stub view ────────────────────────────────────────────────────
    function SignInStub({ onBack }) {
      return (
        <Stack spacing={3} sx={{ py: 6 }}>
          <Typography variant="h4" component="h1">Sign In</Typography>
          <Typography variant="body2" color="text.secondary">
            Sign-in screen placeholder.
          </Typography>
          <Button variant="outlined" onClick={onBack}>Back</Button>
        </Stack>
      );
    }

    // ── Success state view ───────────────────────────────────────────────────
    function SuccessState({ onCreateAnother }) {
      return (
        <Stack spacing={3} sx={{ py: 6 }}>
          <Typography variant="h4" component="h1">Account Created</Typography>
          <Typography variant="body2" color="text.secondary">
            Your account has been created.
          </Typography>
          <Button variant="outlined" onClick={onCreateAnother}>Create another</Button>
        </Stack>
      );
    }

    // ── App — state router ───────────────────────────────────────────────────
    function App() {
      const [view, setView]     = React.useState('form');   // 'form' | 'signin' | 'success'
      const [agreed, setAgreed] = React.useState(false);

      return (
        <Container maxWidth="xs">
          <Box sx={{ py: 6 }}>
            <Fade in timeout={150} key={view}>
              <Box>
                {view === 'form' && (
                  <CreateAccountForm
                    agreed={agreed}
                    onAgreedChange={setAgreed}
                    onSubmit={() => setView('success')}
                    onSignInClick={() => setView('signin')}
                  />
                )}
                {view === 'signin' && (
                  <SignInStub onBack={() => setView('form')} />
                )}
                {view === 'success' && (
                  <SuccessState
                    onCreateAnother={() => { setView('form'); setAgreed(false); }}
                  />
                )}
              </Box>
            </Fade>
          </Box>
        </Container>
      );
    }

    // ── Mount ────────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ThemeProvider theme={theme}>
        <CssBaseline />
        <App />
      </ThemeProvider>
    );
  </script>
</body>
</html>
