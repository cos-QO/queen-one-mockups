    // ── Helpers ───────────────────────────────────────────────────────────────
    function lifecycleChip(status) {
      const map = {
        'Draft':      { bg: '#F1F5F9', color: '#6B7280' },
        'In Review':  { bg: '#FEF9C3', color: '#854D0E' },
        'Approved':   { bg: '#DCFCE7', color: '#166534' },
        'Deprecated': { bg: '#FEE2E2', color: '#991B1B' },
      };
      const s = map[status] || { bg: '#F1F5F9', color: '#6B7280' };
      return <Chip label={status} size="small" sx={{ bgcolor: s.bg, color: s.color, fontWeight: 500, fontSize: '12px' }} />;
    }

    function commitChip(status) {
      const map = {
        'Committed':  { bg: '#DCFCE7', color: '#166534' },
        'Staged':     { bg: '#EFF6FF', color: '#1D4ED8' },
        'Pending':    { bg: '#FEF9C3', color: '#854D0E' },
      };
      const s = map[status] || { bg: '#F1F5F9', color: '#6B7280' };
      return (
        <Chip
          label={status}
          size="small"
          icon={<GitCommit width={14} height={14} strokeWidth={1.5} style={{ color: s.color }} />}
          sx={{ bgcolor: s.bg, color: s.color, fontWeight: 500, fontSize: '12px',
                '& .MuiChip-icon': { color: s.color } }}
        />
      );
    }

    // ── App Root ───────────────────────────────────────────────────────────────
    function App() {
      // State Architecture — 11 variables per brief
      const [currentView, setCurrentView]           = React.useState('library-table');
      const [activeModal, setActiveModal]           = React.useState(null);
      const [selectedAssets, setSelectedAssets]     = React.useState([]);
      const [previewAssetId, setPreviewAssetId]     = React.useState(null);
      const [stagedChanges, setStagedChanges]       = React.useState(false);
      const [pendingChangesCount, setPendingChangesCount] = React.useState(0);
      const [commitHistoryTab, setCommitHistoryTab] = React.useState(0);
      const [activeFilters, setActiveFilters]       = React.useState([]);
      const [searchQuery, setSearchQuery]           = React.useState('');
      const [previousView, setPreviousView]         = React.useState('library-table');
      const [toastMessage, setToastMessage]         = React.useState('');

      // Derived right-drawer priority rule — never set directly
      const rightDrawer =
        selectedAssets.length >= 2 ? 'selection-sidebar'
        : selectedAssets.length === 1 ? 'asset-preview'
        : null;

      // Empty state trigger: selecting 3+ filters simulates zero results (wireframe demo)
      const showEmptyState = activeFilters.length >= 3;

      // ── Handlers ──────────────────────────────────────────────────────────
      function handleRowClick(id) {
        setSelectedAssets([id]);
        setPreviewAssetId(id);
      }

      function handleCheckboxToggle(id, replaceWith) {
        if (replaceWith !== undefined) {
          // Select-all / clear-all
          setSelectedAssets(replaceWith);
          if (replaceWith.length === 1) setPreviewAssetId(replaceWith[0]);
          else if (replaceWith.length === 0) setPreviewAssetId(null);
        } else {
          setSelectedAssets(prev => {
            const next = prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id];
            if (next.length === 0) setPreviewAssetId(null);
            else if (next.length === 1) setPreviewAssetId(next[0]);
            return next;
          });
        }
      }

      function handleClosePreview() {
        setSelectedAssets([]);
        setPreviewAssetId(null);
      }

      function handlePrevAsset() {
        const idx = STUB_ASSETS.findIndex(a => a.id === previewAssetId);
        if (idx > 0) {
          const prev = STUB_ASSETS[idx - 1].id;
          setPreviewAssetId(prev);
          setSelectedAssets([prev]);
        }
      }

      function handleNextAsset() {
        const idx = STUB_ASSETS.findIndex(a => a.id === previewAssetId);
        if (idx < STUB_ASSETS.length - 1) {
          const next = STUB_ASSETS[idx + 1].id;
          setPreviewAssetId(next);
          setSelectedAssets([next]);
        }
      }

      function handleViewChange(view) {
        setCurrentView(view);
      }

      function handleFilterToggle(value) {
        setActiveFilters(prev =>
          prev.includes(value) ? prev.filter(x => x !== value) : [...prev, value]
        );
      }

      function handleRemoveFilter(value) {
        setActiveFilters(prev => prev.filter(x => x !== value));
      }

      function handleOpenUpload() {
        setPreviousView(currentView);
        setActiveModal('upload');
      }

      function handleUploadConfirm() {
        setActiveModal(null);
        setToastMessage('Assets uploaded');
      }

      function handleReviewCommit() {
        setActiveModal('commit-history');
      }

      function handleCommit() {
        setActiveModal(null);
        setSelectedAssets([]);
        setPreviewAssetId(null);
        setPendingChangesCount(0);
        setStagedChanges(false);
        setToastMessage('Changes committed');
      }

      return (
        <Box sx={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', bgcolor: '#EAEAF0' }}>
          {/* ── Top Chrome ── */}
          <TopAppBar onUpload={handleOpenUpload} />
          <SubToolbar
            currentView={currentView}
            onViewChange={handleViewChange}
            onUpload={handleOpenUpload}
            searchQuery={searchQuery}
            onSearchChange={setSearchQuery}
          />

          {/* ── Content Area ── */}
          <Box sx={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'row' }}>
            {/* Left filter sidebar */}
            <FilterSidebar activeFilters={activeFilters} onFilterToggle={handleFilterToggle} />

            {/* Main content */}
            <Box sx={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', overflowY: 'auto' }}>
              {/* Active filter chips */}
              <ActiveFilterChips activeFilters={activeFilters} onRemoveFilter={handleRemoveFilter} />

              {/* Table or Tile view */}
              {/* ── Section: MainContent ─────────────────────────────── */}
              {/* → ConnectUI: AssetLibraryContent | spacing.lg */}
              <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                {currentView === 'library-table' ? (
                  <AssetTable
                    assets={STUB_ASSETS}
                    selectedAssets={selectedAssets}
                    onRowClick={handleRowClick}
                    onCheckboxToggle={handleCheckboxToggle}
                    showEmpty={showEmptyState}
                    onClearFilters={() => setActiveFilters([])}
                  />
                ) : (
                  <AssetTileGrid
                    assets={STUB_ASSETS}
                    selectedAssets={selectedAssets}
                    onTileClick={handleRowClick}
                    onCheckboxToggle={handleCheckboxToggle}
                    showEmpty={showEmptyState}
                    onClearFilters={() => setActiveFilters([])}
                  />
                )}
              </Box>

              {/* Pagination — always visible */}
              <PaginationFooter />
            </Box>

            {/* ── Right Drawer (persistent, single instance) ── */}
            {/* → ConnectUI: OrionPersistentDrawer | transition: slide-right 250ms */}
            <Drawer
              variant="persistent"
              anchor="right"
              open={rightDrawer !== null}
              sx={{
                width: rightDrawer !== null ? 420 : 0,
                flexShrink: 0,
                '& .MuiDrawer-paper': {
                  width: 420,
                  position: 'relative',
                  height: '100%',
                  zIndex: 1050,
                  borderLeft: '1px solid #E4E4E7',
                  borderRight: 'none',
                  borderTop: 'none',
                  borderBottom: 'none',
                },
              }}>
              {rightDrawer === 'asset-preview' && (
                <AssetPreviewContent
                  assetId={previewAssetId}
                  assets={STUB_ASSETS}
                  stagedChanges={stagedChanges}
                  onStage={() => { setStagedChanges(true); setPendingChangesCount(c => c + 1); }}
                  onReviewCommit={handleReviewCommit}
                  onClose={handleClosePreview}
                  onPrev={handlePrevAsset}
                  onNext={handleNextAsset}
                />
              )}
              {rightDrawer === 'selection-sidebar' && (
                <SelectionSidebarContent
                  selectedAssets={selectedAssets}
                  assets={STUB_ASSETS}
                  pendingChangesCount={pendingChangesCount}
                  onStage={() => setPendingChangesCount(c => c + 1)}
                  onReviewCommit={handleReviewCommit}
                  onClear={handleClosePreview}
                />
              )}
            </Drawer>
          </Box>

          {/* ── Modals ── */}
          <UploadModal
            open={activeModal === 'upload'}
            onClose={() => setActiveModal(null)}
            onUpload={handleUploadConfirm}
          />
          <CommitHistoryModal
            open={activeModal === 'commit-history'}
            onClose={() => setActiveModal(null)}
            onCommit={handleCommit}
            pendingChangesCount={pendingChangesCount}
            commitHistoryTab={commitHistoryTab}
            onTabChange={setCommitHistoryTab}
          />

          {/* ── Toast ── */}
          {/* → ConnectUI: OrionSnackbar | spacing.sm */}
          <Snackbar
            open={!!toastMessage}
            autoHideDuration={3000}
            onClose={() => setToastMessage('')}
            anchorOrigin={{ vertical: 'bottom', horizontal: 'center' }}>
            <Alert
              onClose={() => setToastMessage('')}
              severity="success"
              variant="outlined"
              sx={{
                bgcolor: '#DCFCE7', color: '#166534', borderColor: '#166534',
                fontSize: '13px', fontWeight: 500,
                '& .MuiAlert-icon': { color: '#166534' }
              }}>
              {toastMessage}
            </Alert>
          </Snackbar>
        </Box>
      );
    }

    // ── Render ─────────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(
      <MaterialUI.ThemeProvider theme={theme}>
        <App />
      </MaterialUI.ThemeProvider>
    );
  </script>
</body>
</html>
