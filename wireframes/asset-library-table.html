<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CREATIVESPHERE — Asset Library (Table View)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F5F5F5; }
    #root { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      Box, Typography, Toolbar, AppBar, Tabs, Tab, IconButton,
      TextField, InputAdornment, Button, Chip, Checkbox,
      Paper, Stack, Divider, Collapse, List, ListItem,
      ListItemText, ListItemIcon, Avatar, Badge,
      Table, TableBody, TableCell, TableContainer,
      TableHead, TableRow, Tooltip, Select, MenuItem,
      FormControl, InputLabel
    } = MaterialUI;

    // ── Palette ──────────────────────────────────────────────────
    const PRIMARY = '#6B21A8';
    const PRIMARY_LIGHT = '#F3E8FF';

    // ── Status badge config ───────────────────────────────────────
    const STATUS_STYLES = {
      'Draft':      { bg: '#E0E0E0', color: '#616161' },
      'In Review':  { bg: '#BDBDBD', color: '#424242' },
      'Approved':   { bg: '#9E9E9E', color: '#212121' },
      'Archived':   { bg: '#EEEEEE', color: '#9E9E9E' },
    };

    // ── Table rows data ───────────────────────────────────────────
    const ROWS = [
      { id: 1,  name: 'image-001.png',            category: 'Apparel > Tops',    status: 'Approved',   skus: 3,  source: 'Manual',  date: 'Jan 12, 2026', selected: false },
      { id: 2,  name: 'product-shot-front.jpg',   category: 'Footwear',          status: 'In Review',  skus: 1,  source: 'Skuburt', date: 'Feb 03, 2026', selected: false },
      { id: 3,  name: 'lookbook-p3.png',          category: 'Accessories',       status: 'Draft',      skus: 0,  source: 'API',     date: 'Feb 14, 2026', selected: true  },
      { id: 4,  name: 'hero-shot-001.jpg',        category: 'Apparel > Tops',    status: 'Approved',   skus: 5,  source: 'Manual',  date: 'Mar 01, 2026', selected: false },
      { id: 5,  name: 'summer-flat-02.png',       category: 'Apparel > Bottoms', status: 'Archived',   skus: 2,  source: 'Skuburt', date: 'Mar 10, 2026', selected: false },
      { id: 6,  name: 'campaign-banner-v2.jpg',   category: 'Apparel > Tops',    status: 'In Review',  skus: 4,  source: 'API',     date: 'Mar 15, 2026', selected: false },
      { id: 7,  name: 'product-back-view.png',    category: 'Footwear',          status: 'Approved',   skus: 7,  source: 'Manual',  date: 'Mar 22, 2026', selected: false },
      { id: 8,  name: 'lookbook-cover.jpg',       category: 'Accessories',       status: 'Draft',      skus: 0,  source: 'Skuburt', date: 'Apr 01, 2026', selected: false },
      { id: 9,  name: 'spring-editorial-01.png',  category: 'Apparel > Bottoms', status: 'Approved',   skus: 6,  source: 'API',     date: 'Apr 08, 2026', selected: false },
      { id: 10, name: 'detail-shot-shoe.jpg',     category: 'Footwear',          status: 'In Review',  skus: 2,  source: 'Manual',  date: 'Apr 14, 2026', selected: false },
      { id: 11, name: 'hero-shot-bag-01.png',     category: 'Accessories',       status: 'Approved',   skus: 3,  source: 'Skuburt', date: 'Apr 20, 2026', selected: false },
      { id: 12, name: 'archive-flat-denim.jpg',   category: 'Apparel > Bottoms', status: 'Archived',   skus: 1,  source: 'API',     date: 'Apr 28, 2026', selected: false },
    ];

    // ── Thumbnail placeholder ─────────────────────────────────────
    function ThumbnailPlaceholder() {
      return (
        <Box
          sx={{
            width: 56, height: 56,
            bgcolor: '#E0E0E0',
            borderRadius: 1,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            flexShrink: 0,
          }}
        >
          <svg width="28" height="22" viewBox="0 0 28 22" fill="none">
            <rect x="1" y="1" width="26" height="20" rx="2" stroke="#BDBDBD" strokeWidth="1.5" fill="none"/>
            <circle cx="9" cy="8" r="2.5" stroke="#BDBDBD" strokeWidth="1.5" fill="none"/>
            <path d="M1 16l7-6 5 5 4-3.5 10 6.5" stroke="#BDBDBD" strokeWidth="1.5" strokeLinejoin="round" fill="none"/>
          </svg>
        </Box>
      );
    }

    // ── Status Badge ──────────────────────────────────────────────
    // → ConnectUI: <StatusChip status={row.status}> | token: color.status.*
    function StatusBadge({ status }) {
      const s = STATUS_STYLES[status] || STATUS_STYLES['Draft'];
      return (
        <Box sx={{
          display: 'inline-flex', alignItems: 'center',
          px: 1.25, py: 0.25,
          bgcolor: s.bg, color: s.color,
          borderRadius: '12px',
          fontSize: '0.75rem', fontWeight: 500,
          whiteSpace: 'nowrap',
        }}>
          {status}
        </Box>
      );
    }

    // ── Crown logo SVG ────────────────────────────────────────────
    function CrownIcon() {
      return (
        <svg width="22" height="18" viewBox="0 0 22 18" fill="none" style={{ marginRight: 4 }}>
          <path d="M1 17L3.5 7L8 12L11 3L14 12L18.5 7L21 17H1Z" fill={PRIMARY} stroke={PRIMARY} strokeWidth="1.2" strokeLinejoin="round"/>
        </svg>
      );
    }

    // ── Icons (inline SVG) ────────────────────────────────────────
    function TableViewIcon({ active }) {
      return (
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="16" height="3" rx="1" fill={active ? PRIMARY : '#9E9E9E'}/>
          <rect x="1" y="7" width="16" height="3" rx="1" fill={active ? PRIMARY : '#9E9E9E'}/>
          <rect x="1" y="13" width="16" height="3" rx="1" fill={active ? PRIMARY : '#9E9E9E'}/>
        </svg>
      );
    }

    function TileViewIcon() {
      return (
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="7" height="7" rx="1.5" fill="#9E9E9E"/>
          <rect x="10" y="1" width="7" height="7" rx="1.5" fill="#9E9E9E"/>
          <rect x="1" y="10" width="7" height="7" rx="1.5" fill="#9E9E9E"/>
          <rect x="10" y="10" width="7" height="7" rx="1.5" fill="#9E9E9E"/>
        </svg>
      );
    }

    function FilterIcon() {
      return (
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4h12M4 8h8M6 12h4" stroke="#616161" strokeWidth="1.5" strokeLinecap="round"/>
        </svg>
      );
    }

    function SearchIcon() {
      return (
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="4.5" stroke="#9E9E9E" strokeWidth="1.5"/>
          <path d="M10.5 10.5L14 14" stroke="#9E9E9E" strokeWidth="1.5" strokeLinecap="round"/>
        </svg>
      );
    }

    function ChevronDownIcon({ size = 14 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 14 14" fill="none">
          <path d="M3 5l4 4 4-4" stroke="#616161" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );
    }

    function ChevronRightIcon({ size = 14 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 14 14" fill="none">
          <path d="M5 3l4 4-4 4" stroke="#616161" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );
    }

    function UserAvatarIcon() {
      return (
        <Box sx={{
          width: 32, height: 32, borderRadius: '50%',
          bgcolor: '#E0E0E0',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="7" r="3" stroke="#757575" strokeWidth="1.5"/>
            <path d="M3 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#757575" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
        </Box>
      );
    }

    // ── Filter Rail Section ───────────────────────────────────────
    function FilterSection({ title, expanded: defaultExpanded = false, children }) {
      const [open, setOpen] = React.useState(defaultExpanded);
      return (
        <Box sx={{ borderBottom: '1px solid #F0F0F0' }}>
          <Box
            onClick={() => setOpen(!open)}
            sx={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              px: 2, py: 1.25, cursor: 'pointer',
              '&:hover': { bgcolor: '#FAFAFA' },
            }}
          >
            <Typography sx={{ fontSize: '0.8125rem', fontWeight: 600, color: '#424242' }}>
              {title}
            </Typography>
            {open ? <ChevronDownIcon /> : <ChevronRightIcon />}
          </Box>
          <Collapse in={open}>
            <Box sx={{ px: 2, pb: 1.5 }}>
              {children}
            </Box>
          </Collapse>
        </Box>
      );
    }

    // ── App Component ─────────────────────────────────────────────
    function App() {
      const [rows, setRows] = React.useState(ROWS);
      const [searchValue, setSearchValue] = React.useState('');
      const [sortValue, setSortValue] = React.useState('modified');

      const selectedCount = rows.filter(r => r.selected).length;

      function toggleRow(id) {
        setRows(prev => prev.map(r => r.id === id ? { ...r, selected: !r.selected } : r));
      }

      function toggleAll(checked) {
        setRows(prev => prev.map(r => ({ ...r, selected: checked })));
      }

      const allSelected = rows.length > 0 && rows.every(r => r.selected);
      const someSelected = rows.some(r => r.selected) && !allSelected;

      return (
        <Box sx={{ display: 'flex', flexDirection: 'column', height: '100vh', overflow: 'hidden' }}>

          {/* ── App Chrome ─────────────────────────────────────────────── */}
          {/* → Existing CREATIVESPHERE shell — do not replace in engineering */}

          {/* ── Top App Bar ──────────────────────────────────────────── */}
          <Box sx={{
            height: 56, bgcolor: '#FFFFFF', borderBottom: '1px solid #E0E0E0',
            display: 'flex', alignItems: 'center', px: 2, flexShrink: 0,
            zIndex: 1100,
          }}>
            {/* Left: Logo + Brand */}
            <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5, minWidth: 180 }}>
              <CrownIcon />
              <Typography sx={{ fontWeight: 600, fontSize: '0.875rem', color: '#212121', mr: 0.5 }}>
                ADDALL XR
              </Typography>
              <ChevronDownIcon size={12} />
            </Box>

            {/* Center: Nav Tabs */}
            <Box sx={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
              {['Connect', 'Creative', 'People', 'Dimensions', 'Besties', 'Settings'].map(tab => (
                <Box key={tab} sx={{
                  px: 2, py: 1.75,
                  fontSize: '0.8125rem',
                  fontWeight: tab === 'Creative' ? 600 : 400,
                  color: tab === 'Creative' ? PRIMARY : '#616161',
                  borderBottom: tab === 'Creative' ? `2px solid ${PRIMARY}` : '2px solid transparent',
                  cursor: 'pointer',
                  transition: 'color 0.15s',
                  '&:hover': { color: PRIMARY },
                  userSelect: 'none',
                }}>
                  {tab}
                </Box>
              ))}
            </Box>

            {/* Right: User Avatar */}
            <Box sx={{ minWidth: 180, display: 'flex', justifyContent: 'flex-end' }}>
              <UserAvatarIcon />
            </Box>
          </Box>

          {/* ── Sub-tabs bar ─────────────────────────────────────────── */}
          <Box sx={{
            height: 40, bgcolor: '#FFFFFF', borderBottom: '1px solid #E0E0E0',
            display: 'flex', alignItems: 'flex-end', px: 3, flexShrink: 0,
          }}>
            {['Tiles', 'Asset Library', 'Brand Book'].map(tab => (
              <Box key={tab} sx={{
                px: 2, pb: 0.75, mr: 0.5,
                fontSize: '0.8125rem',
                fontWeight: tab === 'Asset Library' ? 600 : 400,
                color: tab === 'Asset Library' ? PRIMARY : '#757575',
                borderBottom: tab === 'Asset Library' ? `2px solid ${PRIMARY}` : '2px solid transparent',
                cursor: 'pointer',
                userSelect: 'none',
              }}>
                {tab}
              </Box>
            ))}
          </Box>

          {/* ── Colorful rainbow stripe ───────────────────────────────── */}
          <Box sx={{
            height: 8, flexShrink: 0,
            background: 'linear-gradient(to right, #FF6B35, #F7C59F, #FFE66D, #06D6A0, #118AB2, #EF476F, #7B2FBE)',
          }} />

          {/* ── Page content area ─────────────────────────────────────── */}
          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', bgcolor: '#F5F5F5' }}>

            {/* ── Top Bar / Sub-header ─────────────────────────────────── */}
            {/* → ConnectUI: <PageHeader> + <SearchField> + <ButtonGroup> | tokens: spacing.md, color.primary */}
            <Box sx={{
              bgcolor: '#FFFFFF',
              borderBottom: '1px solid #E8E8E8',
              px: 3, py: 1.25,
              display: 'flex', alignItems: 'center', gap: 2,
              flexShrink: 0,
              flexWrap: 'nowrap',
            }}>
              {/* Left: Title */}
              <Typography sx={{ fontWeight: 600, fontSize: '0.9375rem', color: '#212121', whiteSpace: 'nowrap', minWidth: 110 }}>
                Asset Library
              </Typography>

              {/* Center: Search */}
              <Box sx={{ flex: 1, maxWidth: 420 }}>
                <TextField
                  size="small"
                  placeholder="Search assets, tags, SKUs…"
                  value={searchValue}
                  onChange={e => setSearchValue(e.target.value)}
                  fullWidth
                  InputProps={{
                    startAdornment: (
                      <InputAdornment position="start">
                        <SearchIcon />
                      </InputAdornment>
                    ),
                    sx: { fontSize: '0.8125rem', bgcolor: '#FAFAFA' },
                  }}
                  sx={{
                    '& .MuiOutlinedInput-root': {
                      '& fieldset': { borderColor: '#E0E0E0' },
                      '&:hover fieldset': { borderColor: '#BDBDBD' },
                    },
                  }}
                />
              </Box>

              {/* Right cluster */}
              <Stack direction="row" alignItems="center" spacing={1} sx={{ flexShrink: 0, ml: 'auto' }}>
                {/* View toggle */}
                <Box sx={{
                  display: 'flex', border: '1px solid #E0E0E0', borderRadius: 1,
                  overflow: 'hidden',
                }}>
                  <Box sx={{
                    px: 1, py: 0.625, display: 'flex', alignItems: 'center',
                    bgcolor: PRIMARY_LIGHT, cursor: 'pointer',
                  }}>
                    <TableViewIcon active={true} />
                  </Box>
                  <Box sx={{
                    px: 1, py: 0.625, display: 'flex', alignItems: 'center',
                    cursor: 'pointer', '&:hover': { bgcolor: '#FAFAFA' },
                    borderLeft: '1px solid #E0E0E0',
                  }}>
                    <TileViewIcon />
                  </Box>
                </Box>

                {/* Filters button */}
                <Button
                  variant="outlined"
                  size="small"
                  startIcon={<FilterIcon />}
                  sx={{
                    fontSize: '0.75rem', textTransform: 'none',
                    borderColor: '#E0E0E0', color: '#424242',
                    '&:hover': { borderColor: '#BDBDBD', bgcolor: '#FAFAFA' },
                    height: 32,
                  }}
                >
                  Filters
                </Button>

                {/* Sort dropdown */}
                <FormControl size="small" sx={{ minWidth: 100 }}>
                  <Select
                    value={sortValue}
                    onChange={e => setSortValue(e.target.value)}
                    displayEmpty
                    sx={{
                      fontSize: '0.75rem', height: 32,
                      '& .MuiOutlinedInput-notchedOutline': { borderColor: '#E0E0E0' },
                    }}
                  >
                    <MenuItem value="modified" sx={{ fontSize: '0.8125rem' }}>Last Modified</MenuItem>
                    <MenuItem value="name" sx={{ fontSize: '0.8125rem' }}>Name</MenuItem>
                    <MenuItem value="status" sx={{ fontSize: '0.8125rem' }}>Status</MenuItem>
                  </Select>
                </FormControl>

                {/* Upload button */}
                <Button
                  variant="contained"
                  size="small"
                  sx={{
                    bgcolor: PRIMARY, '&:hover': { bgcolor: '#581C87' },
                    textTransform: 'none', fontSize: '0.8125rem',
                    borderRadius: '16px', px: 2, height: 32,
                  }}
                >
                  Upload
                </Button>

                {/* Enter Edit Mode */}
                <Button
                  variant="outlined"
                  size="small"
                  sx={{
                    borderColor: PRIMARY, color: PRIMARY,
                    textTransform: 'none', fontSize: '0.8125rem',
                    height: 32, whiteSpace: 'nowrap',
                    '&:hover': { bgcolor: PRIMARY_LIGHT },
                  }}
                >
                  Enter Edit Mode
                </Button>
              </Stack>
            </Box>

            {/* ── Main body: Filter rail + Table ───────────────────────── */}
            <Box sx={{ flex: 1, display: 'flex', overflow: 'hidden', gap: 0 }}>

              {/* ── Left Filter Rail ─────────────────────────────────────── */}
              {/* → ConnectUI: <FilterPanel> | Category: <TreeSelect>, Tags: <ChipMultiSelect>, Status: <CheckboxGroup> */}
              <Box sx={{
                width: 240, flexShrink: 0,
                bgcolor: '#FFFFFF', borderRight: '1px solid #E8E8E8',
                overflowY: 'auto',
                pt: 1,
              }}>
                <Box sx={{ px: 2, py: 1 }}>
                  <Typography sx={{ fontSize: '0.6875rem', fontWeight: 600, color: '#9E9E9E', letterSpacing: '0.08em', textTransform: 'uppercase' }}>
                    Filters
                  </Typography>
                </Box>

                {/* Category — TreeSelect */}
                <FilterSection title="Category" expanded={true}>
                  {/* → ConnectUI: <TreeSelect> */}
                  {[
                    { label: 'Apparel > Tops', indent: 0, checked: true },
                    { label: 'Apparel > Bottoms', indent: 0, checked: false },
                    { label: 'Footwear', indent: 0, checked: false },
                    { label: 'Accessories', indent: 0, checked: false },
                  ].map(item => (
                    <Box key={item.label} sx={{ display: 'flex', alignItems: 'center', py: 0.25, ml: item.indent * 2 }}>
                      <Checkbox
                        checked={item.checked}
                        size="small"
                        sx={{ p: 0.5, color: '#BDBDBD', '&.Mui-checked': { color: PRIMARY } }}
                      />
                      <Typography sx={{ fontSize: '0.8rem', color: '#424242', ml: 0.5 }}>
                        {item.label}
                      </Typography>
                    </Box>
                  ))}
                </FilterSection>

                {/* Tags — ChipMultiSelect */}
                <FilterSection title="Tags" expanded={true}>
                  {/* → ConnectUI: <ChipMultiSelect> */}
                  <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 0.75, mb: 1 }}>
                    {['summer-2026', 'lookbook', 'hero-shot', 'product-flat', 'campaign'].map((tag, i) => (
                      <Chip
                        key={tag}
                        label={tag}
                        size="small"
                        variant={i < 2 ? 'filled' : 'outlined'}
                        sx={{
                          fontSize: '0.6875rem', height: 22,
                          bgcolor: i < 2 ? '#EDE9FE' : 'transparent',
                          color: i < 2 ? PRIMARY : '#616161',
                          borderColor: i < 2 ? 'transparent' : '#BDBDBD',
                        }}
                      />
                    ))}
                  </Box>
                  <TextField
                    size="small"
                    placeholder="+ Search tags"
                    InputProps={{
                      sx: { fontSize: '0.75rem', height: 28 },
                    }}
                    sx={{
                      width: '100%',
                      '& .MuiOutlinedInput-root': {
                        '& fieldset': { borderColor: '#E0E0E0' },
                      },
                    }}
                  />
                </FilterSection>

                {/* Status — CheckboxGroup */}
                <FilterSection title="Status" expanded={true}>
                  {/* → ConnectUI: <CheckboxGroup> */}
                  {[
                    { label: 'Draft', count: 4 },
                    { label: 'In Review', count: 3 },
                    { label: 'Approved', count: 8 },
                    { label: 'Archived', count: 2 },
                  ].map(item => (
                    <Box key={item.label} sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', py: 0.25 }}>
                      <Box sx={{ display: 'flex', alignItems: 'center' }}>
                        <Checkbox
                          size="small"
                          sx={{ p: 0.5, color: '#BDBDBD', '&.Mui-checked': { color: PRIMARY } }}
                        />
                        <Typography sx={{ fontSize: '0.8rem', color: '#424242', ml: 0.5 }}>
                          {item.label}
                        </Typography>
                      </Box>
                      <Typography sx={{ fontSize: '0.75rem', color: '#9E9E9E' }}>
                        {item.count}
                      </Typography>
                    </Box>
                  ))}
                </FilterSection>

                {/* Collapsed sections */}
                {['Product / SKU', 'Source', 'Date Range', 'Usage Type / Rights'].map(title => (
                  <FilterSection key={title} title={title} expanded={false} />
                ))}
              </Box>

              {/* ── Right: Table area ─────────────────────────────────── */}
              <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative' }}>

                {/* ── Main Table ──────────────────────────────────────────── */}
                {/* → ConnectUI: <DataGrid> (MUI X) or <Table> | row selection via GridRowSelectionModel */}
                <Box sx={{ flex: 1, overflowY: 'auto', pb: selectedCount > 0 ? '60px' : 0 }}>
                  <TableContainer component={Paper} elevation={0} sx={{ borderRadius: 0, bgcolor: 'transparent' }}>
                    <Table stickyHeader size="small">
                      <TableHead>
                        <TableRow>
                          <TableCell padding="checkbox" sx={{ bgcolor: '#FFFFFF', borderBottom: '1px solid #E8E8E8', pl: 2 }}>
                            <Checkbox
                              size="small"
                              indeterminate={someSelected}
                              checked={allSelected}
                              onChange={e => toggleAll(e.target.checked)}
                              sx={{ color: '#BDBDBD', '&.Mui-checked': { color: PRIMARY }, '&.MuiCheckbox-indeterminate': { color: PRIMARY } }}
                            />
                          </TableCell>
                          <TableCell sx={{ bgcolor: '#FFFFFF', borderBottom: '1px solid #E8E8E8', fontSize: '0.75rem', fontWeight: 600, color: '#757575' }}>Thumbnail</TableCell>
                          <TableCell sx={{ bgcolor: '#FFFFFF', borderBottom: '1px solid #E8E8E8', fontSize: '0.75rem', fontWeight: 600, color: '#757575' }}>Filename</TableCell>
                          <TableCell sx={{ bgcolor: '#FFFFFF', borderBottom: '1px solid #E8E8E8', fontSize: '0.75rem', fontWeight: 600, color: '#757575' }}>Category</TableCell>
                          <TableCell sx={{ bgcolor: '#FFFFFF', borderBottom: '1px solid #E8E8E8', fontSize: '0.75rem', fontWeight: 600, color: '#757575' }}>Status</TableCell>
                          <TableCell sx={{ bgcolor: '#FFFFFF', borderBottom: '1px solid #E8E8E8', fontSize: '0.75rem', fontWeight: 600, color: '#757575' }}>SKU Count</TableCell>
                          <TableCell sx={{ bgcolor: '#FFFFFF', borderBottom: '1px solid #E8E8E8', fontSize: '0.75rem', fontWeight: 600, color: '#757575' }}>Source</TableCell>
                          <TableCell sx={{ bgcolor: '#FFFFFF', borderBottom: '1px solid #E8E8E8', fontSize: '0.75rem', fontWeight: 600, color: '#757575' }}>Last Modified</TableCell>
                        </TableRow>
                      </TableHead>
                      <TableBody>
                        {rows.map((row) => (
                          <TableRow
                            key={row.id}
                            onClick={() => toggleRow(row.id)}
                            sx={{
                              cursor: 'pointer',
                              bgcolor: row.selected ? '#E3F2FD' : '#FFFFFF',
                              '&:hover': { bgcolor: row.selected ? '#D6EAF8' : '#FAFAFA' },
                              borderBottom: '1px solid #F5F5F5',
                            }}
                          >
                            <TableCell padding="checkbox" sx={{ pl: 2 }}>
                              <Checkbox
                                size="small"
                                checked={row.selected}
                                onChange={() => toggleRow(row.id)}
                                onClick={e => e.stopPropagation()}
                                sx={{ color: '#BDBDBD', '&.Mui-checked': { color: PRIMARY } }}
                              />
                            </TableCell>
                            <TableCell sx={{ py: 1 }}>
                              <ThumbnailPlaceholder />
                            </TableCell>
                            <TableCell sx={{ fontSize: '0.8125rem', color: '#212121' }}>
                              {row.name}
                            </TableCell>
                            <TableCell sx={{ fontSize: '0.8125rem', color: '#616161' }}>
                              {row.category}
                            </TableCell>
                            <TableCell>
                              <StatusBadge status={row.status} />
                            </TableCell>
                            <TableCell sx={{ fontSize: '0.8125rem', color: '#424242', textAlign: 'center' }}>
                              <Box sx={{
                                display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                                minWidth: 24, height: 20, px: 0.75,
                                bgcolor: '#F5F5F5', borderRadius: '10px',
                                fontSize: '0.75rem', fontWeight: 500, color: '#424242',
                              }}>
                                {row.skus}
                              </Box>
                            </TableCell>
                            <TableCell sx={{ fontSize: '0.8125rem', color: '#757575' }}>
                              {row.source}
                            </TableCell>
                            <TableCell sx={{ fontSize: '0.8125rem', color: '#9E9E9E', whiteSpace: 'nowrap' }}>
                              {row.date}
                            </TableCell>
                          </TableRow>
                        ))}
                      </TableBody>
                    </Table>
                  </TableContainer>
                </Box>

                {/* ── Selection Bar ─────────────────────────────────────────── */}
                {/* → ConnectUI: <BulkActionBar> | tokens: spacing.sm, elevation.2 */}
                {selectedCount > 0 && (
                  <Box sx={{
                    position: 'absolute', bottom: 0, left: 0, right: 0,
                    height: 56,
                    bgcolor: '#FFFFFF',
                    borderTop: '1px solid #E0E0E0',
                    boxShadow: '0 -2px 8px rgba(0,0,0,0.08)',
                    display: 'flex', alignItems: 'center',
                    px: 2.5, gap: 1.5,
                    zIndex: 10,
                  }}>
                    <Typography sx={{ fontSize: '0.8125rem', fontWeight: 600, color: '#212121', mr: 1.5 }}>
                      {selectedCount} asset{selectedCount !== 1 ? 's' : ''} selected
                    </Typography>
                    <Divider orientation="vertical" flexItem sx={{ height: 20, alignSelf: 'center' }} />
                    {['Add Tags', 'Change Status', 'Associate SKU', 'Open Preview', 'Enter Edit Mode'].map(action => (
                      <Button
                        key={action}
                        variant="outlined"
                        size="small"
                        sx={{
                          fontSize: '0.75rem', textTransform: 'none',
                          borderColor: '#E0E0E0', color: '#424242',
                          height: 30,
                          '&:hover': { borderColor: PRIMARY, color: PRIMARY, bgcolor: PRIMARY_LIGHT },
                        }}
                      >
                        {action}
                      </Button>
                    ))}
                  </Box>
                )}
              </Box>
            </Box>
          </Box>
        </Box>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
