<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CREATIVESPHERE — Asset Library (Table View)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F7F8FA; }
    #root { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      Box, Typography, Button, Chip, Checkbox,
      Paper, Stack, Divider, Collapse,
      Table, TableBody, TableCell, TableContainer,
      TableHead, TableRow, TextField, InputAdornment,
      FormControl, Select, MenuItem,
    } = MaterialUI;

    const PRIMARY       = '#6B21A8';
    const PRIMARY_LIGHT = '#F3E8FF';
    const PRIMARY_MED   = '#EDE9FE';

    // ── Status badge config ───────────────────────────────────────
    const STATUS_STYLES = {
      'Draft':     { bg: '#F3F4F6', color: '#6B7280', border: '#E5E7EB' },
      'In Review': { bg: '#FEF9C3', color: '#854D0E', border: '#FDE68A' },
      'Approved':  { bg: '#DCFCE7', color: '#166534', border: '#BBF7D0' },
      'Archived':  { bg: '#F1F5F9', color: '#94A3B8', border: '#E2E8F0' },
    };

    const ROWS = [
      { id:  1, name: 'image-001.png',           category: 'Apparel > Tops',    status: 'Approved',   skus: 3,  source: 'Manual',  date: 'Jan 12, 2026', selected: false },
      { id:  2, name: 'product-shot-front.jpg',  category: 'Footwear',          status: 'In Review',  skus: 1,  source: 'Skuburt', date: 'Feb 03, 2026', selected: false },
      { id:  3, name: 'lookbook-p3.png',         category: 'Accessories',       status: 'Draft',      skus: 0,  source: 'API',     date: 'Feb 14, 2026', selected: true  },
      { id:  4, name: 'hero-shot-001.jpg',       category: 'Apparel > Tops',    status: 'Approved',   skus: 5,  source: 'Manual',  date: 'Mar 01, 2026', selected: false },
      { id:  5, name: 'summer-flat-02.png',      category: 'Apparel > Bottoms', status: 'Archived',   skus: 2,  source: 'Skuburt', date: 'Mar 10, 2026', selected: false },
      { id:  6, name: 'campaign-banner-v2.jpg',  category: 'Apparel > Tops',    status: 'In Review',  skus: 4,  source: 'API',     date: 'Mar 15, 2026', selected: false },
      { id:  7, name: 'product-back-view.png',   category: 'Footwear',          status: 'Approved',   skus: 7,  source: 'Manual',  date: 'Mar 22, 2026', selected: false },
      { id:  8, name: 'lookbook-cover.jpg',      category: 'Accessories',       status: 'Draft',      skus: 0,  source: 'Skuburt', date: 'Apr 01, 2026', selected: false },
      { id:  9, name: 'spring-editorial-01.png', category: 'Apparel > Bottoms', status: 'Approved',   skus: 6,  source: 'API',     date: 'Apr 08, 2026', selected: false },
      { id: 10, name: 'detail-shot-shoe.jpg',    category: 'Footwear',          status: 'In Review',  skus: 2,  source: 'Manual',  date: 'Apr 14, 2026', selected: false },
      { id: 11, name: 'hero-shot-bag-01.png',    category: 'Accessories',       status: 'Approved',   skus: 3,  source: 'Skuburt', date: 'Apr 20, 2026', selected: false },
      { id: 12, name: 'archive-flat-denim.jpg',  category: 'Apparel > Bottoms', status: 'Archived',   skus: 1,  source: 'API',     date: 'Apr 28, 2026', selected: false },
    ];

    // ── Thumbnail placeholder ─────────────────────────────────────
    function ThumbnailPlaceholder() {
      return (
        <Box sx={{
          width: 64, height: 64,
          bgcolor: '#F1F5F9',
          borderRadius: '10px',
          border: '1px solid #E2E8F0',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexShrink: 0,
        }}>
          <svg width="24" height="20" viewBox="0 0 24 20" fill="none">
            <rect x="1" y="1" width="22" height="18" rx="2.5" stroke="#CBD5E1" strokeWidth="1.4" fill="none"/>
            <circle cx="8" cy="7.5" r="2" stroke="#CBD5E1" strokeWidth="1.4" fill="none"/>
            <path d="M1 14.5l5.5-5 4 4 3.5-3 9 6" stroke="#CBD5E1" strokeWidth="1.4" strokeLinejoin="round" fill="none"/>
          </svg>
        </Box>
      );
    }

    // ── Status Badge ──────────────────────────────────────────────
    // → ConnectUI: <StatusChip status={row.status}> | token: color.status.*
    function StatusBadge({ status }) {
      const s = STATUS_STYLES[status] || STATUS_STYLES['Draft'];
      return (
        <Box sx={{
          display: 'inline-flex', alignItems: 'center',
          px: 1.5, py: 0.5,
          bgcolor: s.bg,
          border: `1px solid ${s.border}`,
          color: s.color,
          borderRadius: '20px',
          fontSize: '0.75rem',
          fontWeight: 500,
          whiteSpace: 'nowrap',
          letterSpacing: '0.01em',
        }}>
          {status}
        </Box>
      );
    }

    function CrownIcon() {
      return (
        <svg width="20" height="16" viewBox="0 0 20 16" fill="none" style={{ marginRight: 6 }}>
          <path d="M1 15L3 7L7.5 11L10 2L12.5 11L17 7L19 15H1Z" fill={PRIMARY} stroke={PRIMARY} strokeWidth="1.2" strokeLinejoin="round"/>
        </svg>
      );
    }

    function TableViewIcon({ active }) {
      return (
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1.5" width="14" height="2.5" rx="1" fill={active ? PRIMARY : '#94A3B8'}/>
          <rect x="1" y="6.75" width="14" height="2.5" rx="1" fill={active ? PRIMARY : '#94A3B8'}/>
          <rect x="1" y="12" width="14" height="2.5" rx="1" fill={active ? PRIMARY : '#94A3B8'}/>
        </svg>
      );
    }

    function TileViewIcon() {
      return (
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="6" height="6" rx="1.5" fill="#94A3B8"/>
          <rect x="9" y="1" width="6" height="6" rx="1.5" fill="#94A3B8"/>
          <rect x="1" y="9" width="6" height="6" rx="1.5" fill="#94A3B8"/>
          <rect x="9" y="9" width="6" height="6" rx="1.5" fill="#94A3B8"/>
        </svg>
      );
    }

    function FilterIcon() {
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M1.5 3.5h11M3.5 7h7M5.5 10.5h3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
        </svg>
      );
    }

    function SearchIcon() {
      return (
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <circle cx="6.5" cy="6.5" r="4.5" stroke="#94A3B8" strokeWidth="1.5"/>
          <path d="M10 10L13.5 13.5" stroke="#94A3B8" strokeWidth="1.5" strokeLinecap="round"/>
        </svg>
      );
    }

    function ChevronDownIcon({ size = 14, color = '#64748B' }) {
      return (
        <svg width={size} height={size} viewBox="0 0 14 14" fill="none">
          <path d="M3 5l4 4 4-4" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );
    }

    function ChevronRightIcon({ size = 14 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 14 14" fill="none">
          <path d="M5 3l4 4-4 4" stroke="#94A3B8" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );
    }

    function UserAvatarIcon() {
      return (
        <Box sx={{
          width: 32, height: 32, borderRadius: '50%',
          bgcolor: '#F1F5F9', border: '1px solid #E2E8F0',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="6.5" r="2.5" stroke="#94A3B8" strokeWidth="1.4"/>
            <path d="M2.5 15c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" stroke="#94A3B8" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
        </Box>
      );
    }

    // ── Filter Rail Section ───────────────────────────────────────
    function FilterSection({ title, expanded: defaultExpanded = false, children }) {
      const [open, setOpen] = React.useState(defaultExpanded);
      return (
        <Box>
          <Box
            onClick={() => setOpen(!open)}
            sx={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              px: 2.5, py: 1.5,
              cursor: 'pointer',
              '&:hover': { bgcolor: '#F8FAFC' },
            }}
          >
            <Typography sx={{ fontSize: '0.8125rem', fontWeight: 600, color: '#1E293B', letterSpacing: '-0.01em' }}>
              {title}
            </Typography>
            {open ? <ChevronDownIcon /> : <ChevronRightIcon />}
          </Box>
          <Collapse in={open}>
            <Box sx={{ px: 2.5, pb: 2 }}>
              {children}
            </Box>
          </Collapse>
          <Box sx={{ height: 1, bgcolor: '#F1F5F9', mx: 2.5 }} />
        </Box>
      );
    }

    // ── Th cell helper ────────────────────────────────────────────
    const TH = ({ children, align = 'left', width }) => (
      <TableCell
        align={align}
        sx={{
          bgcolor: '#F8FAFC',
          borderBottom: '1px solid #E2E8F0',
          borderTop: '1px solid #E2E8F0',
          py: 1.5,
          px: 2,
          fontSize: '0.6875rem',
          fontWeight: 600,
          color: '#64748B',
          letterSpacing: '0.06em',
          textTransform: 'uppercase',
          whiteSpace: 'nowrap',
          width,
        }}
      >
        {children}
      </TableCell>
    );

    // ── App ───────────────────────────────────────────────────────
    function App() {
      const [rows, setRows]         = React.useState(ROWS);
      const [searchValue, setSearch] = React.useState('');
      const [sortValue, setSort]    = React.useState('modified');

      const selectedCount = rows.filter(r => r.selected).length;
      const allSelected   = rows.length > 0 && rows.every(r => r.selected);
      const someSelected  = rows.some(r => r.selected) && !allSelected;

      const toggleRow  = id => setRows(p => p.map(r => r.id === id ? { ...r, selected: !r.selected } : r));
      const toggleAll  = c  => setRows(p => p.map(r => ({ ...r, selected: c })));

      return (
        <Box sx={{ display: 'flex', flexDirection: 'column', height: '100vh', overflow: 'hidden', bgcolor: '#F7F8FA' }}>

          {/* ── App Chrome ─────────────────────────────────────────────── */}
          {/* → Existing CREATIVESPHERE shell — do not replace in engineering */}

          {/* ── Top App Bar ──────────────────────────────────────────── */}
          <Box sx={{
            height: 58, bgcolor: '#FFFFFF',
            borderBottom: '1px solid #F1F5F9',
            display: 'flex', alignItems: 'center',
            px: 3, flexShrink: 0, zIndex: 1100,
          }}>
            <Box sx={{ display: 'flex', alignItems: 'center', minWidth: 200 }}>
              <CrownIcon />
              <Typography sx={{ fontWeight: 700, fontSize: '0.875rem', color: '#0F172A', letterSpacing: '-0.02em' }}>
                ADDALL XR
              </Typography>
              <Box sx={{ ml: 0.75, mt: 0.25 }}>
                <ChevronDownIcon size={12} color="#94A3B8" />
              </Box>
            </Box>

            <Box sx={{ flex: 1, display: 'flex', justifyContent: 'center', gap: 0.5 }}>
              {['Connect', 'Creative', 'People', 'Dimensions', 'Besties', 'Settings'].map(tab => (
                <Box key={tab} sx={{
                  px: 1.75, py: 1.875,
                  fontSize: '0.8125rem',
                  fontWeight: tab === 'Creative' ? 600 : 400,
                  color: tab === 'Creative' ? PRIMARY : '#64748B',
                  borderBottom: tab === 'Creative' ? `2px solid ${PRIMARY}` : '2px solid transparent',
                  cursor: 'pointer',
                  transition: 'color 0.15s',
                  '&:hover': { color: PRIMARY },
                  userSelect: 'none',
                }}>
                  {tab}
                </Box>
              ))}
            </Box>

            <Box sx={{ minWidth: 200, display: 'flex', justifyContent: 'flex-end' }}>
              <UserAvatarIcon />
            </Box>
          </Box>

          {/* ── Sub-tabs bar ─────────────────────────────────────────── */}
          <Box sx={{
            height: 44, bgcolor: '#FFFFFF',
            borderBottom: '1px solid #F1F5F9',
            display: 'flex', alignItems: 'flex-end',
            px: 3, flexShrink: 0,
          }}>
            {['Tiles', 'Asset Library', 'Brand Book'].map(tab => (
              <Box key={tab} sx={{
                px: 1.75, pb: 0.875, mr: 0.5,
                fontSize: '0.8125rem',
                fontWeight: tab === 'Asset Library' ? 600 : 400,
                color: tab === 'Asset Library' ? PRIMARY : '#64748B',
                borderBottom: tab === 'Asset Library' ? `2px solid ${PRIMARY}` : '2px solid transparent',
                cursor: 'pointer',
                userSelect: 'none',
              }}>
                {tab}
              </Box>
            ))}
          </Box>

          {/* ── Colorful rainbow stripe ───────────────────────────────── */}
          <Box sx={{
            height: 6, flexShrink: 0,
            background: 'linear-gradient(to right, #FF6B35, #FFBE0B, #FFE66D, #06D6A0, #118AB2, #7B2FBE, #EF476F)',
          }} />

          {/* ── Page content area ─────────────────────────────────────── */}
          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

            {/* ── Top Bar / Sub-header ─────────────────────────────────── */}
            {/* → ConnectUI: <PageHeader> + <SearchField> + <ButtonGroup> | tokens: spacing.lg, color.primary */}
            <Box sx={{
              bgcolor: '#FFFFFF',
              borderBottom: '1px solid #F1F5F9',
              px: 3, py: 1.5,
              display: 'flex', alignItems: 'center', gap: 2.5,
              flexShrink: 0,
            }}>
              <Typography sx={{ fontWeight: 700, fontSize: '1rem', color: '#0F172A', whiteSpace: 'nowrap', minWidth: 112, letterSpacing: '-0.02em' }}>
                Asset Library
              </Typography>

              <Box sx={{ flex: 1, maxWidth: 440 }}>
                <TextField
                  size="small"
                  placeholder="Search assets, tags, SKUs…"
                  value={searchValue}
                  onChange={e => setSearch(e.target.value)}
                  fullWidth
                  InputProps={{
                    startAdornment: (
                      <InputAdornment position="start" sx={{ mr: 0.5 }}>
                        <SearchIcon />
                      </InputAdornment>
                    ),
                    sx: {
                      fontSize: '0.8125rem',
                      bgcolor: '#F8FAFC',
                      borderRadius: '8px',
                      height: 36,
                    },
                  }}
                  sx={{
                    '& .MuiOutlinedInput-root': {
                      '& fieldset': { borderColor: '#E2E8F0', borderRadius: '8px' },
                      '&:hover fieldset': { borderColor: '#CBD5E1' },
                    },
                  }}
                />
              </Box>

              <Stack direction="row" alignItems="center" spacing={1} sx={{ flexShrink: 0, ml: 'auto' }}>
                {/* View toggle */}
                <Box sx={{
                  display: 'flex',
                  border: '1px solid #E2E8F0',
                  borderRadius: '8px',
                  overflow: 'hidden',
                }}>
                  <Box sx={{
                    px: 1.25, py: 0.75,
                    display: 'flex', alignItems: 'center',
                    bgcolor: PRIMARY_MED,
                    cursor: 'pointer',
                  }}>
                    <TableViewIcon active={true} />
                  </Box>
                  <Box sx={{
                    px: 1.25, py: 0.75,
                    display: 'flex', alignItems: 'center',
                    cursor: 'pointer',
                    borderLeft: '1px solid #E2E8F0',
                    '&:hover': { bgcolor: '#F8FAFC' },
                  }}>
                    <TileViewIcon />
                  </Box>
                </Box>

                <Button
                  variant="outlined"
                  size="small"
                  startIcon={<FilterIcon />}
                  sx={{
                    fontSize: '0.8125rem', textTransform: 'none',
                    borderColor: '#E2E8F0', color: '#475569',
                    borderRadius: '8px', height: 36, px: 1.5,
                    '&:hover': { borderColor: '#CBD5E1', bgcolor: '#F8FAFC' },
                  }}
                >
                  Filters
                </Button>

                <FormControl size="small">
                  <Select
                    value={sortValue}
                    onChange={e => setSort(e.target.value)}
                    sx={{
                      fontSize: '0.8125rem', height: 36,
                      borderRadius: '8px',
                      '& .MuiOutlinedInput-notchedOutline': { borderColor: '#E2E8F0' },
                      '&:hover .MuiOutlinedInput-notchedOutline': { borderColor: '#CBD5E1' },
                    }}
                  >
                    <MenuItem value="modified" sx={{ fontSize: '0.8125rem' }}>Last Modified</MenuItem>
                    <MenuItem value="name"     sx={{ fontSize: '0.8125rem' }}>Name</MenuItem>
                    <MenuItem value="status"   sx={{ fontSize: '0.8125rem' }}>Status</MenuItem>
                  </Select>
                </FormControl>

                <Button
                  variant="contained"
                  size="small"
                  sx={{
                    bgcolor: PRIMARY, '&:hover': { bgcolor: '#581C87' },
                    textTransform: 'none', fontWeight: 600, fontSize: '0.8125rem',
                    borderRadius: '8px', px: 2.5, height: 36,
                    boxShadow: '0 1px 3px rgba(107,33,168,0.3)',
                  }}
                >
                  Upload
                </Button>

                <Button
                  variant="outlined"
                  size="small"
                  sx={{
                    borderColor: '#E2E8F0', color: '#475569',
                    textTransform: 'none', fontWeight: 500, fontSize: '0.8125rem',
                    borderRadius: '8px', height: 36, whiteSpace: 'nowrap', px: 2,
                    '&:hover': { borderColor: PRIMARY, color: PRIMARY, bgcolor: PRIMARY_LIGHT },
                  }}
                >
                  Enter Edit Mode
                </Button>
              </Stack>
            </Box>

            {/* ── Main body: Filter rail + Table ───────────────────────── */}
            <Box sx={{ flex: 1, display: 'flex', overflow: 'hidden' }}>

              {/* ── Left Filter Rail ─────────────────────────────────────── */}
              {/* → ConnectUI: <FilterPanel> | Category: <TreeSelect>, Tags: <ChipMultiSelect>, Status: <CheckboxGroup> */}
              <Box sx={{
                width: 256, flexShrink: 0,
                bgcolor: '#FFFFFF',
                borderRight: '1px solid #F1F5F9',
                overflowY: 'auto',
              }}>
                <Box sx={{ px: 2.5, pt: 2.5, pb: 1.5 }}>
                  <Typography sx={{ fontSize: '0.6875rem', fontWeight: 700, color: '#94A3B8', letterSpacing: '0.1em', textTransform: 'uppercase' }}>
                    Filters
                  </Typography>
                </Box>

                {/* Category */}
                <FilterSection title="Category" expanded={true}>
                  {/* → ConnectUI: <TreeSelect> */}
                  {[
                    { label: 'Apparel > Tops',    checked: true  },
                    { label: 'Apparel > Bottoms',  checked: false },
                    { label: 'Footwear',           checked: false },
                    { label: 'Accessories',        checked: false },
                  ].map(item => (
                    <Box key={item.label} sx={{ display: 'flex', alignItems: 'center', py: 0.5 }}>
                      <Checkbox
                        checked={item.checked}
                        size="small"
                        sx={{ p: 0.5, color: '#CBD5E1', '&.Mui-checked': { color: PRIMARY } }}
                      />
                      <Typography sx={{ fontSize: '0.8125rem', color: '#334155', ml: 0.75, lineHeight: 1.4 }}>
                        {item.label}
                      </Typography>
                    </Box>
                  ))}
                </FilterSection>

                {/* Tags */}
                <FilterSection title="Tags" expanded={true}>
                  {/* → ConnectUI: <ChipMultiSelect> */}
                  <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 0.75, mb: 1.5 }}>
                    {['summer-2026', 'lookbook', 'hero-shot', 'product-flat', 'campaign'].map((tag, i) => (
                      <Chip
                        key={tag}
                        label={tag}
                        size="small"
                        variant={i < 2 ? 'filled' : 'outlined'}
                        sx={{
                          fontSize: '0.6875rem',
                          height: 24,
                          borderRadius: '6px',
                          bgcolor: i < 2 ? PRIMARY_MED : 'transparent',
                          color: i < 2 ? PRIMARY : '#64748B',
                          borderColor: i < 2 ? 'transparent' : '#E2E8F0',
                          fontWeight: i < 2 ? 500 : 400,
                        }}
                      />
                    ))}
                  </Box>
                  <TextField
                    size="small"
                    placeholder="+ Search tags"
                    InputProps={{ sx: { fontSize: '0.75rem', height: 30, borderRadius: '6px' } }}
                    sx={{
                      width: '100%',
                      '& .MuiOutlinedInput-root': {
                        '& fieldset': { borderColor: '#E2E8F0', borderRadius: '6px' },
                      },
                    }}
                  />
                </FilterSection>

                {/* Status */}
                <FilterSection title="Status" expanded={true}>
                  {/* → ConnectUI: <CheckboxGroup> */}
                  {[
                    { label: 'Draft',     count: 4 },
                    { label: 'In Review', count: 3 },
                    { label: 'Approved',  count: 8 },
                    { label: 'Archived',  count: 2 },
                  ].map(item => (
                    <Box key={item.label} sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', py: 0.5 }}>
                      <Box sx={{ display: 'flex', alignItems: 'center' }}>
                        <Checkbox size="small" sx={{ p: 0.5, color: '#CBD5E1', '&.Mui-checked': { color: PRIMARY } }} />
                        <Typography sx={{ fontSize: '0.8125rem', color: '#334155', ml: 0.75 }}>
                          {item.label}
                        </Typography>
                      </Box>
                      <Typography sx={{ fontSize: '0.75rem', color: '#94A3B8', fontWeight: 500 }}>
                        {item.count}
                      </Typography>
                    </Box>
                  ))}
                </FilterSection>

                {['Product / SKU', 'Source', 'Date Range', 'Usage Type / Rights'].map(title => (
                  <FilterSection key={title} title={title} expanded={false} />
                ))}
              </Box>

              {/* ── Right: Table area ─────────────────────────────────── */}
              <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative' }}>

                {/* ── Main Table ──────────────────────────────────────────── */}
                {/* → ConnectUI: <DataGrid> (MUI X) or <Table> | row selection via GridRowSelectionModel */}
                <Box sx={{ flex: 1, overflowY: 'auto', pb: selectedCount > 0 ? '72px' : 0 }}>
                  <TableContainer component={Paper} elevation={0} sx={{ borderRadius: 0, bgcolor: 'transparent' }}>
                    <Table stickyHeader>
                      <TableHead>
                        <TableRow>
                          <TableCell padding="checkbox" sx={{
                            bgcolor: '#F8FAFC', borderBottom: '1px solid #E2E8F0', borderTop: '1px solid #E2E8F0',
                            pl: 3, pr: 1, py: 1.5, width: 52,
                          }}>
                            <Checkbox
                              size="small"
                              indeterminate={someSelected}
                              checked={allSelected}
                              onChange={e => toggleAll(e.target.checked)}
                              sx={{ color: '#CBD5E1', '&.Mui-checked': { color: PRIMARY }, '&.MuiCheckbox-indeterminate': { color: PRIMARY } }}
                            />
                          </TableCell>
                          <TH width={84}>Thumbnail</TH>
                          <TH>Filename</TH>
                          <TH>Category</TH>
                          <TH width={120}>Status</TH>
                          <TH width={96} align="center">SKU Count</TH>
                          <TH width={96}>Source</TH>
                          <TH width={128}>Last Modified</TH>
                        </TableRow>
                      </TableHead>
                      <TableBody>
                        {rows.map((row) => (
                          <TableRow
                            key={row.id}
                            onClick={() => toggleRow(row.id)}
                            sx={{
                              cursor: 'pointer',
                              bgcolor: row.selected ? '#F5F3FF' : '#FFFFFF',
                              '&:hover': { bgcolor: row.selected ? '#EDE9FE' : '#F8FAFC' },
                              transition: 'background-color 0.1s',
                            }}
                          >
                            <TableCell padding="checkbox" sx={{ pl: 3, pr: 1, borderBottom: '1px solid #F1F5F9' }}>
                              <Checkbox
                                size="small"
                                checked={row.selected}
                                onChange={() => toggleRow(row.id)}
                                onClick={e => e.stopPropagation()}
                                sx={{ color: '#CBD5E1', '&.Mui-checked': { color: PRIMARY } }}
                              />
                            </TableCell>
                            <TableCell sx={{ py: 1.5, px: 2, borderBottom: '1px solid #F1F5F9' }}>
                              <ThumbnailPlaceholder />
                            </TableCell>
                            <TableCell sx={{ py: 1.5, px: 2, fontSize: '0.8125rem', fontWeight: 500, color: '#0F172A', borderBottom: '1px solid #F1F5F9' }}>
                              {row.name}
                            </TableCell>
                            <TableCell sx={{ py: 1.5, px: 2, fontSize: '0.8125rem', color: '#64748B', borderBottom: '1px solid #F1F5F9' }}>
                              {row.category}
                            </TableCell>
                            <TableCell sx={{ py: 1.5, px: 2, borderBottom: '1px solid #F1F5F9' }}>
                              <StatusBadge status={row.status} />
                            </TableCell>
                            <TableCell align="center" sx={{ py: 1.5, px: 2, borderBottom: '1px solid #F1F5F9' }}>
                              <Box sx={{
                                display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                                minWidth: 28, height: 22, px: 1,
                                bgcolor: '#F1F5F9',
                                border: '1px solid #E2E8F0',
                                borderRadius: '6px',
                                fontSize: '0.75rem', fontWeight: 600, color: '#475569',
                              }}>
                                {row.skus}
                              </Box>
                            </TableCell>
                            <TableCell sx={{ py: 1.5, px: 2, fontSize: '0.8125rem', color: '#64748B', borderBottom: '1px solid #F1F5F9' }}>
                              {row.source}
                            </TableCell>
                            <TableCell sx={{ py: 1.5, px: 2, fontSize: '0.8125rem', color: '#94A3B8', whiteSpace: 'nowrap', borderBottom: '1px solid #F1F5F9' }}>
                              {row.date}
                            </TableCell>
                          </TableRow>
                        ))}
                      </TableBody>
                    </Table>
                  </TableContainer>
                </Box>

                {/* ── Selection Bar ─────────────────────────────────────────── */}
                {/* → ConnectUI: <BulkActionBar> | tokens: spacing.md, elevation.2 */}
                {selectedCount > 0 && (
                  <Box sx={{
                    position: 'absolute', bottom: 0, left: 0, right: 0,
                    height: 64,
                    bgcolor: '#FFFFFF',
                    borderTop: '1px solid #E2E8F0',
                    boxShadow: '0 -4px 16px rgba(0,0,0,0.06)',
                    display: 'flex', alignItems: 'center',
                    px: 3, gap: 1.5,
                    zIndex: 10,
                  }}>
                    <Box sx={{
                      display: 'flex', alignItems: 'center', gap: 1,
                      bgcolor: PRIMARY_MED, borderRadius: '8px',
                      px: 1.5, py: 0.5, mr: 1,
                    }}>
                      <Box sx={{
                        width: 20, height: 20, borderRadius: '50%',
                        bgcolor: PRIMARY,
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                      }}>
                        <Typography sx={{ fontSize: '0.6875rem', fontWeight: 700, color: '#FFFFFF', lineHeight: 1 }}>
                          {selectedCount}
                        </Typography>
                      </Box>
                      <Typography sx={{ fontSize: '0.8125rem', fontWeight: 600, color: PRIMARY }}>
                        asset{selectedCount !== 1 ? 's' : ''} selected
                      </Typography>
                    </Box>

                    <Divider orientation="vertical" flexItem sx={{ height: 24, alignSelf: 'center', borderColor: '#E2E8F0' }} />

                    {['Add Tags', 'Change Status', 'Associate SKU', 'Open Preview', 'Enter Edit Mode'].map(action => (
                      <Button
                        key={action}
                        variant="outlined"
                        size="small"
                        sx={{
                          fontSize: '0.8125rem', textTransform: 'none', fontWeight: 500,
                          borderColor: '#E2E8F0', color: '#475569',
                          borderRadius: '8px', height: 34, px: 1.75,
                          '&:hover': { borderColor: PRIMARY, color: PRIMARY, bgcolor: PRIMARY_LIGHT },
                        }}
                      >
                        {action}
                      </Button>
                    ))}
                  </Box>
                )}
              </Box>
            </Box>
          </Box>
        </Box>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
