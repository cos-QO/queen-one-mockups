<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Besties Nav Rail Transforms — Queen One V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/iconoir@latest/css/iconoir.css" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; font-family: 'Inter', sans-serif; }
    body { overflow: hidden; }
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    /* Iconoir icon sizing helpers */
    .icon-20 { font-size: 20px; display: inline-flex; align-items: center; justify-content: center; }
    .icon-16 { font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
    .icon-14 { font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      Box, AppBar, Toolbar, Typography, Drawer, List, ListItemButton,
      ListItemIcon, ListItemText, Divider, IconButton, Button, TextField,
      Avatar, Chip, Card, CardContent, Stack, Grid, Paper,
      ToggleButtonGroup, ToggleButton, Table, TableBody, TableCell,
      TableContainer, TableHead, TableRow, LinearProgress, Select,
      MenuItem, FormControl, ThemeProvider, createTheme, InputBase,
    } = MaterialUI;

    // Icons via Iconoir CSS — loaded from cdn.jsdelivr.net/npm/iconoir@latest/css/iconoir.css
    // Usage: <i className="iconoir-{kebab-name} icon-20" style={{ color: 'inherit' }} />
    function Icon({ name, size = 20, style = {} }) {
      return (
        <i
          className={`iconoir-${name}`}
          style={{ fontSize: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1, ...style }}
        />
      );
    }

    // ── Theme ──────────────────────────────────────────────────────────────
    const theme = createTheme({
      palette: {
        mode: 'light',
        primary:    { main: '#0D0D0D' },
        secondary:  { main: '#6B7280' },
        error:      { main: '#6B7280' },
        warning:    { main: '#9CA3AF' },
        info:       { main: '#6B7280' },
        success:    { main: '#6B7280' },
        background: { default: '#EAEAF0', paper: '#FFFFFF' },
        text: { primary: '#0D0D0D', secondary: '#6B7280', disabled: '#CBD5E1' },
        divider: '#E4E4E7',
      },
      shape: { borderRadius: 8 },
      typography: {
        fontFamily: 'Inter, sans-serif',
        body1: { fontSize: '14px' },
        body2: { fontSize: '14px' },
        caption: { fontSize: '12px' },
        overline: { fontSize: '12px', letterSpacing: '0.06em' },
      },
      shadows: Array(25).fill('none'),
      components: {
        MuiPaper:   { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E4E4E7' } } },
        MuiCard:    { defaultProps: { elevation: 0 }, styleOverrides: { root: { border: '1px solid #E4E4E7' } } },
        MuiAppBar:  { defaultProps: { elevation: 0 }, styleOverrides: { root: { borderBottom: '1px solid #E4E4E7', backgroundColor: '#FFFFFF' } } },
        MuiButton:  { defaultProps: { disableElevation: true }, styleOverrides: { root: { borderRadius: '6px', textTransform: 'none' } } },
        MuiDialog:  { defaultProps: { elevation: 0 }, styleOverrides: { paper: { border: '1px solid #E4E4E7' } } },
        MuiDrawer:  { styleOverrides: { paper: { border: '1px solid #E4E4E7', boxShadow: 'none' } } },
        MuiPopover: { styleOverrides: { paper: { border: '1px solid #E4E4E7', boxShadow: 'none' } } },
        MuiMenu:    { styleOverrides: { paper: { border: '1px solid #E4E4E7', boxShadow: 'none' } } },
        MuiChip:    { styleOverrides: { root: { borderRadius: '4px' } } },
        MuiOutlinedInput: { styleOverrides: { root: { borderRadius: '6px' } } },
        MuiToggleButton:  { styleOverrides: { root: { borderRadius: '6px', textTransform: 'none' } } },
        MuiTableCell: { styleOverrides: { root: { borderBottom: '1px solid #E4E4E7' } } },
      },
    });

    // ── Placeholder Box ────────────────────────────────────────────────────
    function PlaceholderBox({ label, height = 120, subtitle }) {
      return (
        <Box sx={{
          bgcolor: '#F1F5F9', border: '2px dashed #CBD5E1', borderRadius: 1,
          padding: '32px', display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', minHeight: height,
        }}>
          <Typography sx={{ color: '#9CA3AF', fontSize: '13px', fontWeight: 600, letterSpacing: '0.04em' }}>
            {label}
          </Typography>
          {subtitle && (
            <Typography sx={{ color: '#9CA3AF', fontSize: '12px', mt: 1, textAlign: 'center' }}>
              {subtitle}
            </Typography>
          )}
        </Box>
      );
    }

    // ── Status Chip ────────────────────────────────────────────────────────
    function StatusChip({ label, bg, color }) {
      return (
        <Box component="span" sx={{
          display: 'inline-flex', alignItems: 'center',
          padding: '2px 8px', borderRadius: '4px', bgcolor: bg,
          fontSize: '12px', fontWeight: 500, color: color, whiteSpace: 'nowrap',
        }}>
          {label}
        </Box>
      );
    }

    // ── Stage chip helper ──────────────────────────────────────────────────
    const STAGE_CHIPS = {
      'Prospecting':      { bg: '#F1F5F9', color: '#6B7280' },
      'Audit Requested':  { bg: '#FEF9C3', color: '#854D0E' },
      'Pitching':         { bg: '#EFF6FF', color: '#1D4ED8' },
      'Closing':          { bg: '#FEF9C3', color: '#854D0E' },
      'Signed':           { bg: '#DCFCE7', color: '#166534' },
    };

    const PHASE_CHIPS = {
      'Platform Orientation': { bg: '#F1F5F9', color: '#6B7280' },
      'Client Intake':        { bg: '#FEF9C3', color: '#854D0E' },
      'Build Creative':       { bg: '#FEF9C3', color: '#854D0E' },
      'Testing & Approvals':  { bg: '#EFF6FF', color: '#1D4ED8' },
      'Go Live':              { bg: '#DCFCE7', color: '#166534' },
    };

    const ATTENTION_CHIPS = {
      'Stuck in Onboarding':       { bg: '#FEE2E2', color: '#991B1B' },
      'Pipeline — No touch in 14d':{ bg: '#FEF9C3', color: '#854D0E' },
      'At Risk':                   { bg: '#FEE2E2', color: '#991B1B' },
      'Live':                      { bg: '#DCFCE7', color: '#166534' },
    };

    // ── Agency Nav List ────────────────────────────────────────────────────
    // → ConnectUI: SidebarNav (agency mode) | layout.rail.agency
    function AgencyNavList({ screen, handleSetScreen }) {
      const agencyItems = [
        { key: 'besties-hub',     label: 'Besties Hub',     icon: <Icon name="home-simple" size={20} /> },
        { key: 'pipeline-tracker',label: 'Pipeline Tracker',icon: <Icon name="kanban-board" size={20} /> },
        { key: 'client-tracker',  label: 'Client Tracker',  icon: <Icon name="table-2-columns" size={20} /> },
        { key: 'billing',         label: 'Billing',         icon: <Icon name="wallet-alt" size={20} /> },
        { key: 'resources',       label: 'Resources',       icon: <Icon name="book-open-page" size={20} /> },
      ];

      const preSaleItems = [
        { key: 'revenue-calc',   label: 'Revenue Calculator', icon: <Icon name="calculator" size={20} /> },
        { key: 'audit-request',  label: 'Audit Request',       icon: <Icon name="clipboard-check" size={20} /> },
        { key: 'sales-materials',label: 'Sales Materials',     icon: <Icon name="multiple-pages" size={20} /> },
        { key: 'pre-unveil',     label: 'Pre-Unveil',          icon: <Icon name="eye-alt" size={20} /> },
      ];

      const isActive = (key) => screen === key;

      return (
        <List disablePadding sx={{ pt: 1 }}>
          {/* ── Section: AGENCY ── */}
          <Typography sx={{
            fontSize: '12px', fontWeight: 500, color: '#9CA3AF',
            letterSpacing: '0.06em', textTransform: 'uppercase',
            px: 2, pt: 1.5, pb: 0.5,
          }}>
            AGENCY
          </Typography>

          {agencyItems.map((item) => (
            <ListItemButton
              key={item.key}
              onClick={() => handleSetScreen(item.key)}
              sx={{
                mx: 1, mb: 0.5, borderRadius: '6px',
                minHeight: '36px', px: 1.5, py: 0,
                bgcolor: isActive(item.key) ? '#F8F9FC' : 'transparent',
                borderLeft: isActive(item.key) ? '2px solid #0D0D0D' : '2px solid transparent',
                color: isActive(item.key) ? '#0D0D0D' : '#6B7280',
                fontWeight: isActive(item.key) ? 500 : 400,
                '&:hover': { bgcolor: 'rgba(0,0,0,0.04)', color: '#0D0D0D' },
                transition: 'all 0.15s ease',
              }}
            >
              <ListItemIcon sx={{ minWidth: 28, color: 'inherit' }}>
                {item.icon}
              </ListItemIcon>
              <ListItemText
                primary={item.label}
                primaryTypographyProps={{ fontSize: '13px', fontWeight: 'inherit', color: 'inherit' }}
              />
            </ListItemButton>
          ))}

          <Divider sx={{ my: 1, mx: 2, borderColor: '#E4E4E7' }} />

          {/* ── Section: PRE-SALE TOOLS ── */}
          <Typography sx={{
            fontSize: '12px', fontWeight: 500, color: '#9CA3AF',
            letterSpacing: '0.06em', textTransform: 'uppercase',
            px: 2, pt: 0.5, pb: 0.5,
          }}>
            PRE-SALE TOOLS
          </Typography>

          {preSaleItems.map((item) => (
            <ListItemButton
              key={item.key}
              sx={{
                mx: 1, mb: 0.5, borderRadius: '6px',
                minHeight: '36px', px: 1.5, py: 0,
                color: '#6B7280',
                borderLeft: '2px solid transparent',
                '&:hover': { bgcolor: 'rgba(0,0,0,0.04)', color: '#0D0D0D' },
                transition: 'all 0.15s ease',
              }}
            >
              <ListItemIcon sx={{ minWidth: 28, color: 'inherit' }}>
                {item.icon}
              </ListItemIcon>
              <ListItemText
                primary={item.label}
                primaryTypographyProps={{ fontSize: '13px', color: 'inherit' }}
              />
            </ListItemButton>
          ))}
        </List>
      );
    }

    // ── Brand Nav List ─────────────────────────────────────────────────────
    // → ConnectUI: SidebarNav (brand mode) | layout.rail.brand
    function BrandNavList({ brandWorkspaceActiveItem, setBrandWorkspaceActiveItem, handleSetScreen }) {
      const brandItems = [
        { key: 'brand-book',    label: 'Brand Book',    icon: <Icon name="bookmark-book" size={20} /> },
        { key: 'creativesphere',label: 'Creativesphere', icon: <Icon name="sparks" size={20} /> },
        { key: 'connect',       label: 'Connect',        icon: <Icon name="link" size={20} /> },
        { key: 'people',        label: 'People',         icon: <Icon name="group" size={20} /> },
        { key: 'dimensions',    label: 'Dimensions',     icon: <Icon name="bar-chart" size={20} /> },
      ];

      const isActive = (key) => brandWorkspaceActiveItem === key;

      return (
        <List disablePadding sx={{ pt: 1 }}>
          {/* Back to Agency */}
          <ListItemButton
            onClick={() => handleSetScreen('client-tracker')}
            sx={{
              mx: 1, mb: 0.5, borderRadius: '6px',
              minHeight: '36px', px: 1.5, py: 0,
              color: '#6B7280',
              borderLeft: '2px solid transparent',
              '&:hover': { bgcolor: 'rgba(0,0,0,0.04)', color: '#0D0D0D' },
              transition: 'all 0.15s ease',
            }}
          >
            <ListItemIcon sx={{ minWidth: 28, color: 'inherit' }}>
              <Icon name="nav-arrow-left" size={20} />
            </ListItemIcon>
            <ListItemText
              primary="Back to Agency"
              primaryTypographyProps={{ fontSize: '13px', color: 'inherit' }}
            />
          </ListItemButton>

          <Divider sx={{ my: 1, mx: 2, borderColor: '#E4E4E7' }} />

          {brandItems.map((item) => (
            <ListItemButton
              key={item.key}
              onClick={() => setBrandWorkspaceActiveItem(item.key)}
              sx={{
                mx: 1, mb: 0.5, borderRadius: '6px',
                minHeight: '36px', px: 1.5, py: 0,
                bgcolor: isActive(item.key) ? '#F8F9FC' : 'transparent',
                borderLeft: isActive(item.key) ? '2px solid #0D0D0D' : '2px solid transparent',
                color: isActive(item.key) ? '#0D0D0D' : '#6B7280',
                fontWeight: isActive(item.key) ? 500 : 400,
                '&:hover': { bgcolor: 'rgba(0,0,0,0.04)', color: '#0D0D0D' },
                transition: 'all 0.15s ease',
              }}
            >
              <ListItemIcon sx={{ minWidth: 28, color: 'inherit' }}>
                {item.icon}
              </ListItemIcon>
              <ListItemText
                primary={item.label}
                primaryTypographyProps={{ fontSize: '13px', fontWeight: 'inherit', color: 'inherit' }}
              />
            </ListItemButton>
          ))}
        </List>
      );
    }

    // ── AppBar: Besties Hub ────────────────────────────────────────────────
    // → ConnectUI: BestiesHubAppBar | chrome.topBar
    function BestiesHubAppBar() {
      return (
        <AppBar position="sticky" sx={{ zIndex: 1200, color: '#0D0D0D' }}>
          <Toolbar sx={{ height: '56px', minHeight: '56px', px: 3, gap: 2 }}>
            <Typography sx={{ fontSize: '15px', fontWeight: 600, color: '#0D0D0D', display: 'flex', alignItems: 'center', gap: 1 }}>
              👑 Besties Hub
            </Typography>
            <Box sx={{ flex: 1 }} />
            <TextField
              size="small"
              placeholder="Search brands, contacts…"
              InputProps={{
                startAdornment: <Icon name="search" size={16} style={{ color: '#9CA3AF', marginRight: 8 }} />,
              }}
              sx={{ width: 280, '& .MuiOutlinedInput-root': { fontSize: '13px', bgcolor: '#F8F9FC' } }}
            />
            <IconButton size="small" sx={{ color: '#6B7280' }}>
              <Icon name="user-plus" size={20} />
            </IconButton>
            <IconButton size="small" sx={{ color: '#6B7280' }}>
              <Icon name="bell" size={20} />
            </IconButton>
            <Avatar sx={{ width: 32, height: 32, bgcolor: '#E4E4E7', color: '#374151', fontSize: '13px', fontWeight: 500 }}>
              JD
            </Avatar>
          </Toolbar>
        </AppBar>
      );
    }

    // ── AppBar: Pipeline Tracker ───────────────────────────────────────────
    // → ConnectUI: PipelineAppBar | chrome.topBar
    function PipelineAppBar() {
      return (
        <AppBar position="sticky" sx={{ zIndex: 1200, color: '#0D0D0D' }}>
          <Toolbar sx={{ height: '56px', minHeight: '56px', px: 3, gap: 2 }}>
            <Typography sx={{ fontSize: '15px', fontWeight: 600, color: '#0D0D0D' }}>
              Pipeline Tracker
            </Typography>
            <Box sx={{ flex: 1 }} />
            <TextField
              size="small"
              placeholder="Search pipeline…"
              InputProps={{
                startAdornment: <Icon name="search" size={16} style={{ color: '#9CA3AF', marginRight: 8 }} />,
              }}
              sx={{ width: 240, '& .MuiOutlinedInput-root': { fontSize: '13px', bgcolor: '#F8F9FC' } }}
            />
            <Button
              variant="outlined"
              size="small"
              startIcon={<Icon name="filter" size={16} />}
              sx={{
                fontSize: '13px', fontWeight: 500, color: '#374151',
                borderColor: '#CBD5E1', '&:hover': { bgcolor: 'rgba(0,0,0,0.04)', borderColor: '#CBD5E1' }
              }}
            >
              Filter
            </Button>
            <Button
              variant="contained"
              size="small"
              startIcon={<Icon name="plus" size={20} />}
              sx={{
                fontSize: '13px', fontWeight: 500,
                bgcolor: '#0D0D0D', color: '#FFFFFF',
                '&:hover': { bgcolor: '#374151' }
              }}
            >
              Add Brand
            </Button>
          </Toolbar>
        </AppBar>
      );
    }

    // ── AppBar: Client Tracker ─────────────────────────────────────────────
    // → ConnectUI: ClientTrackerAppBar | chrome.topBar
    function ClientTrackerAppBar() {
      return (
        <AppBar position="sticky" sx={{ zIndex: 1200, color: '#0D0D0D' }}>
          <Toolbar sx={{ height: '56px', minHeight: '56px', px: 3, gap: 2 }}>
            <Typography sx={{ fontSize: '15px', fontWeight: 600, color: '#0D0D0D' }}>
              Client Tracker
            </Typography>
            <Box sx={{ flex: 1 }} />
            <TextField
              size="small"
              placeholder="Search clients…"
              InputProps={{
                startAdornment: <Icon name="search" size={16} style={{ color: '#9CA3AF', marginRight: 8 }} />,
              }}
              sx={{ width: 240, '& .MuiOutlinedInput-root': { fontSize: '13px', bgcolor: '#F8F9FC' } }}
            />
            <Button
              variant="outlined"
              size="small"
              startIcon={<Icon name="filter" size={16} />}
              sx={{
                fontSize: '13px', fontWeight: 500, color: '#374151',
                borderColor: '#CBD5E1', '&:hover': { bgcolor: 'rgba(0,0,0,0.04)', borderColor: '#CBD5E1' }
              }}
            >
              Filter
            </Button>
            <Avatar sx={{ width: 32, height: 32, bgcolor: '#E4E4E7', color: '#374151', fontSize: '13px', fontWeight: 500 }}>
              JD
            </Avatar>
          </Toolbar>
        </AppBar>
      );
    }

    // ── AppBar: Brand Workspace ────────────────────────────────────────────
    // → ConnectUI: BrandWorkspaceAppBar | chrome.topBar.brand
    function BrandWorkspaceAppBar({ siteValue, setSiteValue }) {
      return (
        <AppBar position="sticky" sx={{ zIndex: 1200, color: '#0D0D0D' }}>
          <Toolbar sx={{ height: '56px', minHeight: '56px', px: 3, gap: 1.5 }}>
            <Typography sx={{ fontSize: '13px', fontWeight: 500, color: '#0D0D0D' }}>
              Corkcicle
            </Typography>
            <Icon name="nav-arrow-right" size={14} style={{ color: '#9CA3AF' }} />
            <FormControl size="small">
              <Select
                value={siteValue}
                onChange={(e) => setSiteValue(e.target.value)}
                sx={{
                  fontSize: '13px', bgcolor: '#F8F9FC',
                  '& .MuiOutlinedInput-notchedOutline': { borderColor: '#E4E4E7' },
                  '& .MuiSelect-select': { py: '4px', pr: '28px' },
                }}
              >
                <MenuItem value="corkcicle.com" sx={{ fontSize: '13px' }}>corkcicle.com</MenuItem>
                <MenuItem value="corkcicle.com/uk" sx={{ fontSize: '13px' }}>corkcicle.com/uk</MenuItem>
              </Select>
            </FormControl>
            <Box sx={{ flex: 1 }} />
            <TextField
              size="small"
              placeholder="Search brand…"
              InputProps={{
                startAdornment: <Icon name="search" size={16} style={{ color: '#9CA3AF', marginRight: 8 }} />,
              }}
              sx={{ width: 240, '& .MuiOutlinedInput-root': { fontSize: '13px', bgcolor: '#F8F9FC' } }}
            />
            <Avatar sx={{ width: 32, height: 32, bgcolor: '#E4E4E7', color: '#374151', fontSize: '13px', fontWeight: 500 }}>
              JD
            </Avatar>
          </Toolbar>
        </AppBar>
      );
    }

    // ── Besties Hub Screen ─────────────────────────────────────────────────
    // → ConnectUI: BestiesHubScreen | screen.bestiesHub
    function BestiesHubScreen({ handleSetScreen, setClientTrackerView }) {
      const kpiCards = [
        { label: 'Brands Live',        value: '12', sub: 'Active email programs', onClick: () => { setClientTrackerView('live'); handleSetScreen('client-tracker'); } },
        { label: 'Brands Onboarding',  value: '4',  sub: 'In setup phase',        onClick: () => { setClientTrackerView('onboarding'); handleSetScreen('client-tracker'); } },
        { label: 'Brands in Pipeline', value: '7',  sub: 'Pre-sale opportunities',onClick: () => handleSetScreen('pipeline-tracker') },
        { label: 'Agency MRR',         value: '$48,200', sub: 'Monthly recurring revenue', onClick: null },
      ];

      const attentionCards = [
        { brand: 'Corkcicle',  status: 'Stuck in Onboarding',        cta: 'Go to Onboarding', ctaAction: () => { setClientTrackerView('onboarding'); handleSetScreen('client-tracker'); } },
        { brand: 'Authenteak', status: 'Pipeline — No touch in 14d', cta: 'Update Pipeline',  ctaAction: () => handleSetScreen('pipeline-tracker') },
        { brand: 'Nomad Goods',status: 'At Risk',                    cta: 'View Brand',       ctaAction: () => handleSetScreen('brand-workspace') },
      ];

      const toolCards = [
        { label: 'Revenue Calculator', icon: <Icon name="calculator" size={20} /> },
        { label: 'Audit Request Flow', icon: <Icon name="clipboard-check" size={20} /> },
        { label: 'Sales Materials Generator', icon: <Icon name="multiple-pages" size={20} /> },
        { label: 'Pre-Unveil Tool',    icon: <Icon name="eye-alt" size={20} /> },
      ];

      return (
        <Box sx={{ flex: 1, overflowY: 'auto', p: 3, bgcolor: '#EAEAF0', display: 'flex', flexDirection: 'column', gap: 3 }}>
          {/* ── Section: KPI Summary Strip ── */}
          {/* → ConnectUI: KpiSummaryStrip | dashboard.kpiCards */}
          <Grid container spacing={2}>
            {kpiCards.map((card) => (
              <Grid item xs={3} key={card.label}>
                <Paper
                  onClick={card.onClick || undefined}
                  sx={{
                    p: '20px', cursor: card.onClick ? 'pointer' : 'default',
                    '&:hover': card.onClick ? { border: '1px solid #CBD5E1' } : {},
                    transition: 'border 0.15s ease',
                  }}
                >
                  <Typography sx={{ fontSize: '12px', fontWeight: 500, color: '#6B7280', textTransform: 'uppercase', letterSpacing: '0.04em', mb: 1 }}>
                    {card.label}
                  </Typography>
                  <Typography sx={{ fontSize: '20px', fontWeight: 600, color: '#0D0D0D', mb: 0.5 }}>
                    {card.value}
                  </Typography>
                  <Typography sx={{ fontSize: '13px', color: '#6B7280' }}>
                    {card.sub}
                  </Typography>
                </Paper>
              </Grid>
            ))}
          </Grid>

          {/* ── Section: Attention Triage Feed ── */}
          {/* → ConnectUI: AttentionFeed | dashboard.attentionFeed */}
          <Box>
            <Typography sx={{ fontSize: '15px', fontWeight: 600, color: '#0D0D0D', mb: 2 }}>
              Needs your attention
            </Typography>
            <Stack spacing={1.5}>
              {attentionCards.map((card) => {
                const chipStyle = ATTENTION_CHIPS[card.status] || { bg: '#F1F5F9', color: '#6B7280' };
                return (

                            <Typography sx={{ fontSize: '13px', color: '#374151' }}>{row.sends30d}</Typography>
                          </TableCell>
                          <TableCell>
                            <Typography sx={{ fontSize: '13px', color: '#374151' }}>{row.revenue30d}</Typography>
                          </TableCell>
                          <TableCell>
                            <Typography sx={{ fontSize: '13px', color: '#374151' }}>{row.margin}</Typography>
                          </TableCell>
                          <TableCell>
                            <Typography sx={{ fontSize: '13px', color: '#374151' }}>{row.blueprint}</Typography>
                          </TableCell>
                          <TableCell>
                            <Button
                              variant="outlined"
                              size="small"
                              onClick={(e) => { e.stopPropagation(); handleSetScreen('brand-workspace'); }}
                              endIcon={<Icon name="nav-arrow-right" size={14} />}
                              sx={{
                                fontSize: '12px', fontWeight: 500, color: '#374151',
                                borderColor: '#CBD5E1', whiteSpace: 'nowrap',
                                '&:hover': { bgcolor: 'rgba(0,0,0,0.04)', borderColor: '#CBD5E1' }
                              }}
                            >
                              Open
                            </Button>
                          </TableCell>
                        </TableRow>
                      ))}
                    </TableBody>
                  </Table>
                </TableContainer>
              </Paper>
            </>
          )}
        </Box>
      );
    }

    // ── Brand Workspace Screen ─────────────────────────────────────────────
    // → ConnectUI: BrandWorkspaceScreen | screen.brandWorkspace
    function BrandWorkspaceScreen({ brandWorkspaceActiveItem }) {
      const labelMap = {
        'brand-book':    'Brand Book',
        'creativesphere': 'Creativesphere',
        'connect':       'Connect',
        'people':        'People',
        'dimensions':    'Dimensions',
      };
      const activeLabel = labelMap[brandWorkspaceActiveItem] || 'Brand Book';

      return (
        <Box sx={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', p: 3, bgcolor: '#EAEAF0', gap: 3 }}>
          {/* ── Section: Brand Workspace Placeholder ── */}
          {/* → ConnectUI: BrandWorkspacePane | screen.brandWorkspace.content */}
          <Typography sx={{ fontSize: '20px', fontWeight: 600, color: '#0D0D0D' }}>
            {activeLabel}
          </Typography>

          <Box sx={{
            flex: 1, bgcolor: '#F1F5F9', border: '2px dashed #CBD5E1', borderRadius: 1,
            display: 'flex', flexDirection: 'column', alignItems: 'center',
            justifyContent: 'center', padding: '48px', minHeight: 400,
          }}>
            <Typography sx={{ color: '#9CA3AF', fontSize: '13px', fontWeight: 600, letterSpacing: '0.04em', mb: 1 }}>
              BRAND-SCOPED COMPONENT PLACEHOLDER
            </Typography>
            <Typography sx={{ color: '#9CA3AF', fontSize: '12px', textAlign: 'center' }}>
              This is where {activeLabel} content would render for Corkcicle
            </Typography>
          </Box>
        </Box>
      );
    }

    // ── Root App ───────────────────────────────────────────────────────────
    function App() {
      const [screen, setScreenRaw]                         = React.useState('besties-hub');
      const [pipelineDrawerOpen, setPipelineDrawerOpen]    = React.useState(false);
      const [selectedCardId, setSelectedCardId]            = React.useState(null);
      const [clientTrackerView, setClientTrackerView]      = React.useState('onboarding');
      const [brandWorkspaceActiveItem, setBrandWorkspaceActiveItem] = React.useState('brand-book');
      const [siteValue, setSiteValue]                      = React.useState('corkcicle.com');

      // Derived — never stored in state
      // ANTI-PATTERN[QO]: railMode is a derived const, not useState.
      // — Setting it via useState would allow it to desync from screen.
      // — do not change
      const railMode = screen === 'brand-workspace' ? 'brand' : 'agency';

      const handleSetScreen = (newScreen) => {
        if (newScreen !== 'pipeline-tracker') {
          setPipelineDrawerOpen(false);
          setSelectedCardId(null);
        }
        setScreenRaw(newScreen);
      };

      // ── AppBar selector ──
      const renderAppBar = () => {
        if (screen === 'besties-hub')       return <BestiesHubAppBar />;
        if (screen === 'pipeline-tracker')  return <PipelineAppBar />;
        if (screen === 'client-tracker')    return <ClientTrackerAppBar />;
        if (screen === 'brand-workspace')   return <BrandWorkspaceAppBar siteValue={siteValue} setSiteValue={setSiteValue} />;
        return <BestiesHubAppBar />;
      };

      return (
        // Root container: full viewport, flex column, overflow hidden
        <Box sx={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', bgcolor: '#EAEAF0' }}>
          {renderAppBar()}

          {/* Content row: rail + main */}
          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'row', overflow: 'hidden' }}>

            {/* ── Left Rail (Permanent Drawer — always mounted) ── */}
            {/* → ConnectUI: NavRail | layout.rail */}
            {/* ANTI-PATTERN[QO]: position: 'relative' on PaperProps required.
                — MUI permanent Drawer Paper defaults to position: fixed, pulling it out of flex flow.
                — Setting relative keeps it as a proper flex child and makes AppBar sticky work correctly.
                — do not change */}
            <Drawer
              variant="permanent"
              PaperProps={{
                sx: {
                  position: 'relative',
                  width: '240px',
                  height: '100%',
                  overflowY: 'auto',
                  borderRight: '1px solid #E4E4E7',
                  boxShadow: 'none',
                  bgcolor: '#FFFFFF',
                }
              }}
            >
              {/* Rail transform: only the List children swap — Drawer shell stays mounted */}
              {railMode === 'agency' ? (
                <AgencyNavList screen={screen} handleSetScreen={handleSetScreen} />
              ) : (
                <BrandNavList
                  brandWorkspaceActiveItem={brandWorkspaceActiveItem}
                  setBrandWorkspaceActiveItem={setBrandWorkspaceActiveItem}
                  handleSetScreen={handleSetScreen}
                />
              )}
            </Drawer>

            {/* ── Main Content ── */}
            {screen === 'besties-hub' && (
              <BestiesHubScreen
                handleSetScreen={handleSetScreen}
                setClientTrackerView={setClientTrackerView}
              />
            )}
            {screen === 'pipeline-tracker' && (
              <PipelineTrackerScreen
                setPipelineDrawerOpen={setPipelineDrawerOpen}
                setSelectedCardId={setSelectedCardId}
              />
            )}
            {screen === 'client-tracker' && (
              <ClientTrackerScreen
                handleSetScreen={handleSetScreen}
                clientTrackerView={clientTrackerView}
                setClientTrackerView={setClientTrackerView}
              />
            )}
            {screen === 'brand-workspace' && (
              <BrandWorkspaceScreen
                brandWorkspaceActiveItem={brandWorkspaceActiveItem}
              />
            )}
          </Box>

          {/* ── Pipeline Card Drawer (overlay, anchor right) ── */}
          <PipelineCardDrawer
            open={pipelineDrawerOpen}
            onClose={() => { setPipelineDrawerOpen(false); setSelectedCardId(null); }}
            selectedCardId={selectedCardId}
          />
        </Box>
      );
    }

    // ── Render ─────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(ThemeProvider, { theme },
        React.createElement(App)
      )
    );
  </script>
</body>
</html>
